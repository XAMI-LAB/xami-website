# Everyone shown on the site, in the order they appear within their group.
# groups: leader, member, collaborator, alumni (a person can be in more than one).
# Alumni are listed by the year they graduated, newest first. Their affiliations say where they are now.
# Members with a doctorate come first, in the order they graduated; a position does not decide the order.
# Everyone except alumni has a position (for example Associate Professor, Lecturer, PhD Student).
# Collaborators the lab no longer works with stay in the list, after the current ones.
# name is written as on the site; papers are matched by the name without the part in brackets, plus any aliases.
# On the lab's papers, leaders, members, alumni and anyone with "graduated" are shown darker in the author list.

