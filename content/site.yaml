# Text used across the site that is not a person, a theme, a news item or a paper.
# A "highlight" is the part of the sentence above it that is shown in the logo colours; it must match that sentence exactly.

lab:
  name: XAMI Lab
  university: Queensland University of Technology
  universityShort: QUT
  url: https://www.xami-lab.org # the address of the live site, without a slash at the end
  heading: Explainable analytics for machine intelligence
  headingHighlight: machine intelligence
  intro: The Explainable Analytics for Machine Intelligence (XAMI) Lab develops methods to make machine intelligence explainable, transparent, fair and understandable to human decision-makers.
  founded: 2021
  contact: chun-ouyang # id in people.yaml; "Contact us" and the Join us page write to this person

# What search engines and link previews say about each page. A page left out here is described by the
# lab's own words: the vision for Mission, the welcome for Join us, and the intro above for the rest.
# Pages: home, mission, people, research, publications, news, join, acknowledgements.
descriptions: {}

mission:
  vision: To support human-machine collaboration and co-evolution by making machine intelligence explainable, transparent, fair and understandable to human decision-makers.
  visionHighlight: explainable, transparent, fair and understandable
  points:
    - lead: Design fit-for-purpose machine intelligence
      text: that is driven by real-world problems, grounded in domain principles, and optimised to achieve the best balance among accuracy, efficiency, complexity, interpretability, and other task-specific requirements.
    - lead: Embed explainability and interpretability by design
      text: throughout the machine intelligence pipeline, from data and feature representation, model development, prediction and decision-making, to develop transparent, accountable and trustworthy AI systems.
    - lead: Deliver explainable machine intelligence across domains
      text: translating methodological advances into practical, innovative and sustainable solutions for real-world challenges.
  values:
    - Pursuit of Excellence
    - Creativity and Critical Thinking
    - Diversity and Inclusiveness
    - Positivity and Passion

join:
  welcome: We welcome PhD, MPhil and Honours students, visiting researchers and industry partners who want AI that people can understand.
  welcomeHighlight: AI that people can understand.
  ways:
    - title: Research degrees
      text: PhD, MPhil and Honours projects at QUT.
    - title: Visiting researchers
      text: Short and long research visits to the lab.
    - title: Industry and clinical partners
      text: Joint projects in healthcare, process analytics and responsible AI.
  contact:
    text:
      - Write to the lab leader with a short note about your background and the research theme you are interested in. If you are applying for a research degree, include your academic record and a one page idea of what you would like to study.
      - We are happy to talk with industry and clinical partners at any stage, from a first question to a joint project.
    include:
      - item: Your background
      - item: The research theme you are interested in
      - item: Your academic record
        for: Research degrees
      - item: A one page research idea
        for: Research degrees

