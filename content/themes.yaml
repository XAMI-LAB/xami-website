# publications lists every paper of the theme, in any order; the Research themes page shows the newest five.
# people are those working on the theme now. Alumni and collaborators the lab no longer works with are left out;
# a recent graduate stays while their work in the theme is still recent. The pages show them in the order of
# people.yaml, whatever order they are written in here.
# scene is the animated example: loan-decision, chest-xray, chilled-shipment, invoice-handoff or battery-plan.

