- id: ai-driven-energy-forecasting-and-optimisation
  title: "AI-Driven Energy Forecasting and Optimisation"
  scene: battery-plan
  # From the energy group's site (https://energy.xami-lab.org/research/). The second description paragraph is
  # put together from that page's two project descriptions; awaiting the team's review.
  summary: "We develop data-driven methods for forecasting and optimisation in electricity markets, with a particular focus on Australia's National Electricity Market. Our research addresses the challenges the energy transition brings to market operation, including price volatility, uncertainty, and the growing role of renewable and distributed energy resources, with an emphasis on methods that remain reliable under real-world conditions."
  description:
    - "We develop data-driven methods for forecasting and optimisation in electricity markets, with a particular focus on Australia's National Electricity Market. Our research addresses the challenges the energy transition brings to market operation, including price volatility, uncertainty, and the growing role of renewable and distributed energy resources, with an emphasis on methods that remain reliable under real-world conditions."
    - "Our research spans wholesale electricity price forecasting in the National Electricity Market under extreme volatility and renewable-driven structural shifts, including multi-horizon and multi-region forecasting, spike-aware modelling and regime-adaptive methods, and AI-driven coordination of household and community batteries with multi-agent reinforcement learning, balancing household value with community objectives such as peak reduction, renewable utilisation, market participation and battery longevity."
  people:
    - chun-ouyang
    - zhipeng-he
    - mohammed-osman-gani
    - cao-tram-anh-hoang
    - sara-khalifa
  publications:
