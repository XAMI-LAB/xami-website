- id: iot-enabled-process-monitoring-and-intelligence
  title: "IoT-enabled Process Monitoring and Intelligence"
  scene: chilled-shipment
  # Placeholder summary and description, written from the theme's papers; awaiting the team's review.
  summary: "We bring Internet of Things data into business process analysis, deriving IoT-enriched and object-centric event logs so that processes can be monitored and understood in their physical context."
  description:
    - "We connect data from the Internet of Things with business process management, so that what sensors and devices observe can inform how processes are monitored, analysed and improved."
    - "Our research spans methods and tools for deriving IoT-enriched and object-centric event logs, the classification of IoT context in business processes, and applications in real-life logistics, with a focus on turning low-level sensor data into process-level insight."
  people:
    - chun-ouyang
    - jia-wei
  publications:
