- id: agentic-automation-and-workforce-intelligence
  title: "Agentic Automation and Workforce Intelligence"
  scene: invoice-handoff
  # Placeholder summary and description, written from the theme's papers; awaiting the team's review.
  summary: "We study how software robots, AI agents and people share work, combining robotic process automation with process mining of the workforce to design automation that fits how organisations operate."
  description:
    - "We investigate how work is divided between people, software robots and AI agents, and how event data can guide that division."
    - "Our research spans robotic process automation, from bot design patterns to its integration with business process management systems, and workforce analytics through process mining, including resource grouping, work specialisation and the capabilities of new employees, with a focus on automation and work assignment decisions grounded in how work is done."
