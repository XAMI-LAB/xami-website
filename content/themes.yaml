- id: human-centric-explainable-medical-diagnostic-systems
  title: "Human-centric Explainable Medical Diagnostic Systems"
  scene: chest-xray
  # Placeholder summary and description, written from the theme's papers; awaiting the team's review.
  summary: "We build explainable medical diagnostic systems around the way clinicians work, combining medical images with eye-tracking, clinical data and language models so that AI findings can be understood, checked and trusted."
  description:
    - "We develop human-centric, explainable AI for medical diagnosis, designing systems that reflect how clinicians read images and reach decisions."
    - "Our research spans multimodal learning that fuses chest X-rays with radiologists' eye gaze and patients' clinical data, clinical data augmentation with large language models, open multimodal datasets, and trustworthy deep learning for radiology and orthopaedics, with a focus on diagnostic support that clinicians can interpret and verify."
