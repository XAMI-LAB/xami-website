<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>XAMI Lab: Explainable Analytics for Machine Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#06262E; --deep2:#0B3540; --deep3:#124754;
  --ink:#0E2730; --soft:#55696F; --line:#D6E0E1; --mist:#EEF4F4; --paper:#FFFFFF;
  --blue:#2AA8F8; --teal:#18D4A0; --grad:linear-gradient(100deg,#2AA8F8,#18D4A0);
  --serif:"Fraunces","Iowan Old Style",Georgia,serif;
  --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --pad:clamp(20px,5vw,88px);
  --scene:100vh;
  --head:68px;
}
@supports (height:100svh){:root{--scene:100svh}}
html.flat{--scene:900px}
html.flat .s-hero h1{font-size:clamp(38px,5.9vw,94px)}html.flat .hero-mark{width:135px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html.home-view{scroll-snap-type:y proximity}
html.flat,html.flat.home-view{scroll-snap-type:none}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:4px}
.skip{position:absolute;left:12px;top:-60px;background:#fff;color:var(--ink);padding:10px 16px;border-radius:8px;z-index:200;transition:top .15s}
.skip:focus{top:12px}
.serif{font-family:var(--serif);font-weight:380;letter-spacing:-.012em;font-optical-sizing:auto}

/* header */
.head{position:fixed;inset:0 0 auto 0;height:var(--head);z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad);color:#fff;transition:background .35s,box-shadow .35s,color .35s,height .35s}
.head::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,26,32,.55),rgba(4,26,32,0));pointer-events:none;transition:opacity .35s}
.head.solid{background:rgba(6,38,46,.94);backdrop-filter:saturate(1.2) blur(14px);-webkit-backdrop-filter:saturate(1.2) blur(14px);box-shadow:0 1px 0 rgba(255,255,255,.08)}
.head.solid::before{opacity:0}
.brand{position:relative;display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:600;font-size:17px;letter-spacing:.01em}
.brand img{width:34px;height:auto}
.brand small{display:block;font-weight:400;font-size:12.5px;opacity:.72;letter-spacing:0;margin-top:-2px}
.nav{position:relative;display:flex;gap:4px;align-items:center}
.nav a{position:relative;text-decoration:none;font-size:15px;font-weight:500;padding:9px 12px;border-radius:999px;opacity:.86;transition:opacity .2s,background .2s}
.nav a:hover{opacity:1;background:rgba(255,255,255,.1)}
.nav a[aria-current="page"]{opacity:1}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:2px;border-radius:2px;background:var(--grad)}
.nav a.cta{margin-left:8px;opacity:1;border:1px solid rgba(255,255,255,.45);padding:8px 16px}
.nav a.cta:hover{background:#fff;color:var(--deep);border-color:#fff}
.nav a.cta[aria-current="page"]::after{display:none}
.burger{position:relative;display:none;background:none;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:8px 16px;font-size:15px;font-weight:500;cursor:pointer;color:#fff}
.sheet{position:fixed;inset:0;z-index:99;background:var(--deep);color:#fff;padding:calc(var(--head) + 24px) var(--pad) 120px;overflow:auto;opacity:0;visibility:hidden;transform:translateY(-12px);transition:opacity .3s,transform .3s,visibility 0s .3s}
.sheet.open{opacity:1;visibility:visible;transform:none;transition:opacity .3s,transform .3s}
.sheet a{display:block;font-family:var(--serif);font-weight:380;font-size:clamp(30px,8vw,44px);line-height:1.15;text-decoration:none;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.sheet a[aria-current="page"]{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
@media (max-width:1060px){.nav{display:none}.burger{display:block}}

/* view transition */
#view{transition:opacity .28s ease,transform .28s ease;min-height:60vh}
#view.leaving{opacity:0;transform:translateY(10px)}

/* reveal system: content is only hidden when animation is safely available */
html.anim .rv{opacity:0;transform:translate3d(0,34px,0);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform 1.1s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--d,0) * 90ms)}
html.anim .rv.from-l{transform:translate3d(-56px,0,0)}
html.anim .rv.from-r{transform:translate3d(56px,0,0)}
html.anim .rv.zoom{transform:scale(.94)}
html.anim .in .rv,html.anim .rv.in{opacity:1;transform:none}

/* scenes */
.scene{position:relative;min-height:var(--scene);display:flex;align-items:center;padding:calc(var(--head) + 36px) var(--pad) 96px;scroll-snap-align:start;overflow:hidden}
.scene > .inner{position:relative;width:100%;max-width:1320px;margin:0 auto}
.kicker{font-size:14.5px;font-weight:600;color:var(--soft);letter-spacing:.01em;display:flex;align-items:center;gap:12px;margin-bottom:22px}
.kicker::before{content:"";width:34px;height:2px;border-radius:2px;background:var(--grad)}
.dark .kicker{color:rgba(255,255,255,.7)}
.link{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:16px;text-decoration:none;padding-bottom:4px;background:linear-gradient(var(--blue),var(--teal)) 0 100%/100% 2px no-repeat;transition:background-size .3s,color .3s}
.link:hover{background-size:100% 100%;color:#fff;padding-inline:8px;margin-inline:-8px;border-radius:4px}
.btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:600;font-size:16px;padding:15px 28px;border-radius:999px;background:var(--grad);color:#04222A;border:0;cursor:pointer;transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 34px -12px rgba(24,212,160,.7)}
.btn.ghost{background:none;color:inherit;box-shadow:inset 0 0 0 1px currentColor}
.btn.ghost:hover{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px currentColor}

/* scene 1 */
.s-hero{color:#fff;background:var(--deep);align-items:flex-end;padding-top:calc(var(--head) + 20px);padding-bottom:clamp(104px,13vh,140px)}
.s-hero .bg{position:absolute;inset:-4%;background:url(assets/brisbane.jpg) 50% 55%/cover no-repeat;animation:drift 38s ease-in-out infinite alternate;will-change:transform}
@keyframes drift{from{transform:scale(1) translate3d(0,0,0)}to{transform:scale(1.16) translate3d(-2.2%,-1.4%,0)}}
.s-hero .shade{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(4,30,37,.62) 0%,rgba(5,38,46,.42) 34%,rgba(5,36,44,.86) 78%,#06262E 100%),
  linear-gradient(95deg,rgba(6,38,46,.82) 0%,rgba(6,38,46,.2) 70%)}
.s-hero .tint{position:absolute;inset:0;background:radial-gradient(90% 70% at 85% 12%,rgba(42,168,248,.28),transparent 60%),radial-gradient(70% 60% at 10% 100%,rgba(24,212,160,.22),transparent 60%);mix-blend-mode:screen}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(24px,5vw,80px);align-items:end}
.hero-mark{width:clamp(84px,min(9vw,15vh),150px);height:auto;overflow:visible;margin-bottom:clamp(8px,2vh,22px)}
.hero-mark .st{fill:none;stroke:url(#lg);stroke-width:34;stroke-linecap:round;stroke-linejoin:round}
.hero-mark .nd{fill:#06262E;fill-opacity:.35;stroke:url(#lg);stroke-width:34}
.hero-mark .fd{fill:url(#lg)}
html.anim .hero-mark .st{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s cubic-bezier(.6,.1,.2,1) .25s forwards}
html.anim .hero-mark .nd,html.anim .hero-mark .fd{opacity:0;animation:pop .6s ease forwards;animation-delay:calc(1.3s + var(--i) * 110ms)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.hero-mark .nd,.hero-mark .fd{transform-box:fill-box;transform-origin:center}
.s-hero h1{font-family:var(--serif);font-weight:340;font-size:clamp(38px,min(5.9vw,10.5vh),96px);line-height:1;letter-spacing:-.025em;margin:0 0 6px}
.s-hero h1 span{display:block}
.s-hero .name{font-size:clamp(15px,1.3vw,18px);font-weight:600;letter-spacing:.02em;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin-bottom:clamp(10px,2vh,22px)}
.s-hero .name b{font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.s-hero .name i{font-style:normal;opacity:.78;font-weight:500}
.s-hero .mission{max-width:56ch;font-size:clamp(17px,1.45vw,21px);line-height:1.55;color:rgba(255,255,255,.88);margin-top:clamp(18px,3vh,30px)}
.acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:clamp(22px,4vh,38px)}
.hero-side{display:grid;gap:0;min-width:230px;border-left:1px solid rgba(255,255,255,.22);padding-left:28px;padding-bottom:6px}
.hero-side div{padding:clamp(6px,1.3vh,12px) 0}
.hero-side div + div{border-top:1px solid rgba(255,255,255,.14)}
.hero-side b{display:block;font-family:var(--serif);font-weight:340;font-size:clamp(30px,min(3.2vw,5.4vh),50px);line-height:1}
.hero-side span{font-size:14.5px;color:rgba(255,255,255,.74)}
.cue{position:absolute;right:calc(var(--pad) + 8px);bottom:30px;display:flex;align-items:center;gap:12px;font-size:14px;color:rgba(255,255,255,.75);text-decoration:none}
.cue i{display:block;width:1px;height:44px;background:rgba(255,255,255,.3);position:relative;overflow:hidden}
.cue i::after{content:"";position:absolute;left:0;top:-50%;width:100%;height:50%;background:var(--teal);animation:cue 2.2s cubic-bezier(.6,0,.3,1) infinite}
@keyframes cue{to{top:110%}}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}.hero-side{grid-template-columns:repeat(4,auto);justify-content:start;gap:0 26px;border-left:0;border-top:1px solid rgba(255,255,255,.22);padding:8px 0 0;min-width:0}.hero-side div + div{border-top:0}.cue{display:none}}
@media (max-width:520px){.hero-side{grid-template-columns:repeat(2,1fr)}}

/* scene 2 */
.s-about{background:var(--paper)}
.s-about .orb{position:absolute;right:-12vw;top:-18vh;width:60vw;height:60vw;max-width:900px;max-height:900px;border-radius:50%;background:radial-gradient(closest-side,rgba(24,212,160,.16),rgba(42,168,248,.1) 55%,transparent 72%);pointer-events:none}
.statement{font-family:var(--serif);font-weight:340;font-size:clamp(30px,4.3vw,64px);line-height:1.1;letter-spacing:-.02em;max-width:22ch}
.statement em{font-style:italic;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em}
.about-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(28px,5vw,90px);align-items:end}
.about-grid p{color:var(--soft);font-size:18px;max-width:46ch}
.about-grid p + p{margin-top:14px}
.values{display:grid;grid-template-columns:repeat(4,1fr);margin-top:clamp(36px,7vh,80px);border-top:1px solid var(--line)}
.values li{padding:22px 22px 0 0;position:relative}
.values li::before{content:"";position:absolute;left:0;top:-1px;width:44px;height:2px;background:var(--grad)}
.values b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(20px,1.7vw,25px);line-height:1.2}
.values span{display:block;color:var(--soft);font-size:15px;margin-top:6px}
@media (max-width:900px){.about-grid{grid-template-columns:1fr}.values{grid-template-columns:1fr 1fr;row-gap:26px}}

/* theme scenes */
.s-theme{background:var(--mist)}
.s-theme.alt{background:var(--deep);color:#fff}
.theme-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:clamp(28px,5vw,88px);align-items:center}
.s-theme.flip .t-fig{order:2}
.t-fig{position:relative}
.t-fig .plate{position:relative;background:#fff;border-radius:22px;padding:clamp(16px,2.2vw,34px);box-shadow:0 40px 90px -40px rgba(6,38,46,.45),0 0 0 1px rgba(6,38,46,.06);will-change:transform}
.t-fig .plate img{width:100%;height:auto;max-height:56vh;object-fit:contain;border-radius:8px}
html.flat .t-fig .plate img{max-height:500px}
.t-fig .halo{position:absolute;inset:-9% -7% -12% -7%;border-radius:40px;background:linear-gradient(130deg,var(--tc),transparent 70%);opacity:.22;filter:blur(2px);will-change:transform}
.t-fig .count{position:absolute;right:-14px;bottom:-22px;background:var(--deep);color:#fff;border-radius:18px;padding:14px 20px;display:flex;align-items:baseline;gap:10px;box-shadow:0 18px 40px -18px rgba(0,0,0,.6);will-change:transform}
.s-theme.alt .t-fig .count{background:#fff;color:var(--ink)}
.t-fig .count b{font-family:var(--serif);font-weight:380;font-size:40px;line-height:1}
.t-fig .count span{font-size:14px;opacity:.8}
.t-num{font-family:var(--serif);font-style:italic;font-weight:340;font-size:19px;color:var(--soft);display:flex;align-items:center;gap:12px;margin-bottom:18px}
.t-num i{width:12px;height:12px;border-radius:50%;background:var(--tc);box-shadow:0 0 0 5px color-mix(in srgb,var(--tc) 22%,transparent)}
.alt .t-num{color:rgba(255,255,255,.7)}
.t-body h2{font-family:var(--serif);font-weight:350;font-size:clamp(32px,3.9vw,58px);line-height:1.04;letter-spacing:-.02em}
.t-body .sum{font-size:clamp(17px,1.35vw,20px);color:var(--soft);margin-top:20px;max-width:48ch}
.alt .t-body .sum{color:rgba(255,255,255,.8)}
.topics{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 30px}
.topics li{font-size:14.5px;padding:7px 14px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.alt .topics li{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.quote{font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.45;border-left:2px solid var(--tc);padding:2px 0 2px 16px;margin:0 0 26px;max-width:44ch;color:var(--soft)}
.alt .quote{color:rgba(255,255,255,.82)}
@media (max-width:900px){.theme-grid{grid-template-columns:1fr}.s-theme.flip .t-fig{order:0}.t-fig .count{right:10px}}

/* people scene */
.s-people{background:var(--paper);flex-direction:column;justify-content:center;padding-inline:0}
.s-people > .inner{padding-inline:var(--pad);max-width:calc(1320px + 2 * var(--pad))}
.sec-h{font-family:var(--serif);font-weight:350;font-size:clamp(32px,4vw,60px);line-height:1.04;letter-spacing:-.02em;max-width:18ch}
.sec-p{color:var(--soft);font-size:18px;max-width:50ch;margin-top:14px}
.dark .sec-p{color:rgba(255,255,255,.78)}
.lead-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,3vw,48px);align-items:end}
.leader{position:relative;display:block;text-decoration:none;border-radius:22px;overflow:hidden;background:var(--deep2);aspect-ratio:4/4.5;max-height:52vh;width:100%;color:#fff}
html.flat .leader{max-height:470px}
.leader img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.leader:hover img{transform:scale(1.05)}
.leader div{position:absolute;inset:auto 0 0 0;padding:70px 22px 20px;background:linear-gradient(180deg,transparent,rgba(4,26,32,.9))}
.leader b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(21px,1.8vw,27px);line-height:1.15}
.leader span{font-size:14.5px;opacity:.82}
.marquee{width:100%;overflow:hidden;margin-top:clamp(28px,5vh,56px);-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.track{display:flex;gap:18px;width:max-content;animation:slide 60s linear infinite;padding:4px 0}
.marquee:hover .track,.marquee:focus-within .track{animation-play-state:paused}
@keyframes slide{to{transform:translate3d(-50%,0,0)}}
.chip{display:flex;align-items:center;gap:12px;text-decoration:none;padding:8px 22px 8px 8px;border-radius:999px;background:var(--mist);white-space:nowrap;transition:background .2s}
.chip:hover{background:#DDEBEA}
.chip b{display:block;font-weight:600;font-size:15px;line-height:1.2}
.chip span{display:block;font-size:13px;color:var(--soft)}
.face{flex:none;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#2AA8F8,#18D4A0);display:grid;place-items:center;color:#04222A;font-weight:700;position:relative}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.chip .face{width:56px;height:56px;font-size:16px}
@media (max-width:900px){.lead-grid{grid-template-columns:1fr 1fr}.lead-grid .intro{grid-column:1/-1}.leader{max-height:none}}

/* work scene */
.s-work{background:var(--deep);color:#fff}
.s-work .glow{position:absolute;left:-10vw;bottom:-30vh;width:70vw;height:70vw;border-radius:50%;background:radial-gradient(closest-side,rgba(42,168,248,.16),transparent 70%);pointer-events:none}
.work-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(28px,5vw,90px)}
.col-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:8px}
.col-h h2{font-family:var(--serif);font-weight:350;font-size:clamp(28px,2.8vw,42px);letter-spacing:-.015em;line-height:1.1}
.pubs li{border-top:1px solid rgba(255,255,255,.14)}
.light .pubs li{border-top-color:var(--line)}
.pub{display:grid;grid-template-columns:72px minmax(0,1fr);gap:18px;padding:16px 0;align-items:start}
.thumb{width:72px;height:72px;border-radius:12px;overflow:hidden;background:var(--deep3);flex:none}
.thumb svg{display:block;width:100%;height:100%}
.pub h3{font-size:16.5px;font-weight:600;line-height:1.32}
.pub h3 a{text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .3s}
.pub h3 a:hover{background-size:100% 1px}
.pub .au{font-size:14.5px;color:rgba(255,255,255,.7);margin-top:3px}
.pub .au b{font-weight:600;color:#fff}
.light .pub .au{color:var(--soft)}.light .pub .au b{color:var(--ink)}
.pub .ve{font-size:14px;color:rgba(255,255,255,.6);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.light .pub .ve{color:var(--soft)}
.pub .ve em{font-family:var(--serif);font-style:italic;font-size:15px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--tc)}
.pl{font-size:13.5px;font-weight:600;text-decoration:none;padding:2px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);transition:background .2s,color .2s}
.pl:hover{background:#fff;color:var(--deep)}
.light .pl{box-shadow:inset 0 0 0 1px var(--line)}
.light .pl:hover{background:var(--deep);color:#fff}
.newsl li{border-top:1px solid rgba(255,255,255,.14);padding:16px 0;display:grid;grid-template-columns:48px minmax(0,1fr);gap:16px}
.newsl .face{width:48px;height:48px;font-size:14px}
.newsl time{font-size:13.5px;color:rgba(255,255,255,.62)}
.newsl h3{font-size:16.5px;font-weight:600;line-height:1.3;margin-top:1px}
.newsl p{font-size:14.5px;color:rgba(255,255,255,.72);margin-top:3px}
.more{margin-top:22px}
@media (max-width:900px){.work-grid{grid-template-columns:1fr}}

/* join scene */
.s-join{background:var(--mist)}
.s-join .ring{position:absolute;right:-8vw;top:50%;translate:0 -50%;width:min(52vw,760px);aspect-ratio:1;opacity:.5;pointer-events:none}
.s-join .ring circle{fill:none;stroke:url(#lg2);stroke-width:1.2}
.s-join .ring g{transform-origin:50% 50%;animation:spin 80s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.join-h{font-family:var(--serif);font-weight:340;font-size:clamp(38px,6vw,96px);line-height:1;letter-spacing:-.025em;max-width:13ch}
.join-l{font-size:clamp(18px,1.5vw,21px);color:var(--soft);max-width:50ch;margin:24px 0 0}

<script>
(function () {
  "use strict";
  var X = window.XAMI;
  var root = document.documentElement;
  var params = new URLSearchParams(location.search);
  var flat = params.get("flat") === "1";
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var canObserve = "IntersectionObserver" in window;
  var animate = !reduce && canObserve && !flat;
  if (flat) root.classList.add("flat");
  if (animate) root.classList.add("anim");

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function plain(s) { return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
  var $ = function (id) { return document.getElementById(id); };
  var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  function when(d) { var p = String(d).split("-"); return p[1] ? MONTHS[+p[1] - 1] + " " + p[0] : p[0]; }

  var COLOUR = { process: "#2AA8F8", causal: "#18D4A0", persuasive: "#F2B84B", medical: "#F27A93" };
  var themeById = {};
  X.themes.forEach(function (t) { t.colour = COLOUR[t.id] || "#2AA8F8"; themeById[t.id] = t; t.pubs = []; t.people = []; });

  /* people and their papers, matched by surname and first initial */
  function nameParts(name) {
    var w = name.replace(/\(.*?\)/g, " ").replace(/\b(A\/Prof|Prof|Dr|Eng)\.?\s/g, " ").trim().split(/\s+/);
    return { first: w[0], last: w[w.length - 1] };
  }
  var people = X.people.slice().sort(function (a, b) { return a.order - b.order; });
  var personById = {};
  people.forEach(function (p) {
    var n = nameParts(p.name);
    p.first = n.first; p.last = n.last;
    p.initials = (n.first[0] + n.last[0]).toUpperCase();
    p.short = p.name.replace(/^(A\/Prof|Prof|Dr|Eng)\.?\s+/, "");
    p.pubs = []; p.counts = {};
    var g = /(\d{4})\s*$/.exec(p.role);
    p.year = p.group === "Alumni" && g ? g[1] : "";
    personById[p.id] = p;
  });
  function isPerson(author, p) {
    var w = author.trim().split(/\s+/);
    return plain(w[w.length - 1]) === plain(p.last) && plain(w[0])[0] === plain(p.first)[0];
  }
  X.pubs.forEach(function (pub) {
    pub.lab = [];
    pub.authors.forEach(function (a) {
      people.forEach(function (p) {
        if (isPerson(a, p) && pub.lab.indexOf(p) < 0) {
          pub.lab.push(p); p.pubs.push(pub);
          p.counts[pub.theme] = (p.counts[pub.theme] || 0) + 1;
        }
      });
    });
    if (themeById[pub.theme]) themeById[pub.theme].pubs.push(pub);
    pub.link = pub.doi ? (/^https?:/.test(pub.doi) ? pub.doi : "https://doi.org/" + pub.doi) : (pub.url || "");
  });
  people.forEach(function (p) {
    var best = Object.keys(p.counts).sort(function (a, b) { return p.counts[b] - p.counts[a]; })[0];
    p.theme = best ? themeById[best] : null;
  });
  X.themes.forEach(function (t) {
    t.people = people.filter(function (p) { return p.counts[t.id]; })
      .sort(function (a, b) { return b.counts[t.id] - a.counts[t.id]; });
  });
  var years = [];
  X.pubs.forEach(function (p) { if (years.indexOf(p.year) < 0) years.push(p.year); });
  years.sort(function (a, b) { return b - a; });
  var universities = X.partners.length;

  function face(p, cls) {
    return '<span class="face ' + (cls || "") + '" aria-hidden="true">' + esc(p.initials) +
      '<img src="' + esc(p.photo) + '" alt="" loading="lazy" onerror="this.remove()"></span>';
  }

  /* generated thumbnail: a small node and line figure in the theme colour */
  function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function thumb(pub) {

      if (!inYear.length) return;
      html += '<section class="yr"><h2>' + y + "<small>" + inYear.length + (inYear.length === 1 ? " paper" : " papers") + '</small></h2><div class="light"><ul class="pubs">' +
        inYear.map(function (p) { return pubItem(p, rawWords, 8); }).join("") + "</ul></div></section>";
    });
    return html;
  }
  function viewPubs() {
    var yb = '<button class="fb" type="button" data-f="year" data-v="all" aria-pressed="' + (pubState.year === "all") + '">All years</button>' +
      years.map(function (y) { return '<button class="fb" type="button" data-f="year" data-v="' + y + '" aria-pressed="' + (pubState.year === String(y)) + '">' + y + "</button>"; }).join("");
    var tb = '<button class="fb" type="button" data-f="theme" data-v="all" aria-pressed="' + (pubState.theme === "all") + '">All themes</button>' +
      X.themes.map(function (t) {
        return '<button class="fb" type="button" data-f="theme" data-v="' + esc(t.id) + '" aria-pressed="' + (pubState.theme === t.id) + '" style="--tc:' + t.colour + '"><i></i>' + esc(t.short) + "</button>";
      }).join("");
    return phead("Publications", X.pubs.length + " papers since " + years[years.length - 1] + ". Search by title, author or venue, or narrow the list by year and theme.") +
      page('<div class="tools"><div class="row"><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>' +
        '<input id="q" type="search" placeholder="Search title, author or venue" aria-label="Search publications" value="' + esc(pubState.q) + '" autocomplete="off"></label></div>' +
        '<div class="row"><span class="fl">Year</span>' + yb + '</div><div class="row"><span class="fl">Theme</span>' + tb + "</div></div>" +
        '<div id="results">' + pubResults() + "</div>");
  }
  function wirePubs() {
    var q = $("q"), res = $("results");
    if (!q) return;
    q.addEventListener("input", function () { pubState.q = q.value; res.innerHTML = pubResults(); });
    document.querySelectorAll(".fb").forEach(function (b) {
      b.addEventListener("click", function () {
        pubState[b.dataset.f] = b.dataset.v;
        document.querySelectorAll('.fb[data-f="' + b.dataset.f + '"]').forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
        res.innerHTML = pubResults();
      });
    });
  }

  function viewNews() {
    return phead("News", "New people, graduations and papers from the lab.") +
      page('<ul class="nlist">' + X.news.map(function (n) {
        return '<li class="rv"><time>' + esc(when(n.date)) + "<small>" + esc(n.kind) + "</small></time>" + newsFaces(n) +
          "<div><h2>" + esc(n.title) + "</h2><p>" + esc(n.text) + "</p></div></li>";
      }).join("") + "</ul>");
  }
  function viewVideos() {
    return phead("Videos", "Talks and seminars by members of the lab.") +
      page('<div class="vgrid">' + X.videos.map(function (v) {
        return '<a class="vid rv" href="https://www.youtube.com/watch?v=' + esc(v.id) + '" target="_blank" rel="noopener"><span class="shot"><img src="https://i.ytimg.com/vi/' + esc(v.id) +
          '/hqdefault.jpg" alt="" loading="lazy"><span class="play" aria-hidden="true"></span></span><span>' + esc(v.venue) + "</span><b>" + esc(v.title) + "</b></a>";
      }).join("") + "</div>");
  }
  function viewJoin() {
    var lead = people.filter(function (p) { return p.group === "Leader"; });
    return phead("Join us", X.join.lead) +
      page('<section class="block"><div class="block-h"><div><h2>Ways to work with us</h2><p>Tell us which one fits you when you write.</p></div><div>' +
        '<ul class="opts rv" style="margin-top:0;max-width:none">' + X.join.options.map(function (o) { return "<li><b>" + esc(o.title) + "</b><span>" + esc(o.text) + "</span></li>"; }).join("") + "</ul>" +
        '<p class="rv"><a class="btn" href="' + esc(lead[0] && lead[0].url || "#/people") + '" target="_blank" rel="noopener">' + esc(X.join.contact) + "</a></p></div></div></section>" +
        '<section class="block"><div class="block-h"><div><h2>What to send</h2><p>A short first message is enough.</p></div><ul class="ticks" style="--tc:var(--teal)">' +
        "<li class=\"rv\">Who you are and what you have studied or worked on</li><li class=\"rv\">Which research theme interests you, and why</li><li class=\"rv\">Your CV, and a paper or project you are proud of</li></ul></div></section>" +
        '<section class="block"><div class="block-h"><div><h2>Lab leaders</h2><p>Your first point of contact.</p></div><div class="pgrid big">' + lead.map(personCard).join("") + "</div></div></section>");
  }
  function viewProjects() {
    return phead("Project sites", "Some projects have a website of their own.") +
      page('<p class="note">These are separate websites on their own addresses, each with its own look. The links below leave the lab site.</p><div class="sites">' +
        X.projects.map(function (s) {
          return '<a class="site rv" href="https://' + esc(s.address) + '" target="_blank" rel="noopener external"><span class="ext"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg>Separate website</span>' +
            "<b>" + esc(s.name) + "</b><p>" + esc(s.text) + "</p><code>" + esc(s.address) + "</code></a>";
        }).join("") + "</div>");
  }
  var MISSION = [
    ["Create breakthroughs in building explainable analytics for machine intelligence", [
      "Devise new methods and techniques to build robust and interpretable models",
      "Design new theories and algorithms to detect biases and provide ethical and fair analyses of machine learned predictions",
      "Develop new frameworks and tools for user-centric intelligent predictive systems that keep people in the loop"]],
    ["Apply explainable machine intelligence to a wide range of application domains and industry sectors to promote innovative and sustainable industrialisation", []],
    ["Build collaborative networks and foster multi-stakeholder partnerships in explainable machine intelligence", []],
    ["Cultivate young research students to become a new generation of high achievers in data science", []]
  ];
  var ACK = ["QUT Women in Research Grant Scheme 2021", "QUT Centre for Data Science First Byte Funding Program 2021",
    "Australian Government Research Training Program Scholarships, 2019 to 2023", "QUT Science and Engineering Faculty Diversity Scholarship, 2020 to 2023",
    "QUT Postgraduate Research Award (International) Scholarships, 2021 to 2025", "QUT Science and Engineering Faculty Scholarship, 2021 to 2024",
    "QUT Centre for Data Science Higher Degree Research and Top Up Scholarships, 2021 to 2024", "QUT Vacation Research Experience Scheme Scholarship 2020",
    "QUT International Merit Scholarship 2021", "QUT Higher Degree Research Internship Industry Scholarship 2021"];
  function viewMission() {
    return phead("Mission", X.tagline + ".") +
      page('<section class="block"><div class="block-h"><div><h2>Our vision</h2></div><div class="prose"><p class="big rv">' + esc(X.vision) + "</p></div></div></section>" +
        '<section class="block"><div class="block-h"><div><h2>Our mission</h2></div><ol class="mlist">' + MISSION.map(function (m, i) {
          return '<li class="rv"><i>' + (i + 1) + "</i><div>" + esc(m[0]) + (m[1].length ? "<ul>" + m[1].map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ul>" : "") + "</div></li>";
        }).join("") + "</ol></div></section>" +
        '<section class="block"><div class="block-h"><div><h2>Our values</h2></div><ul class="values" style="margin-top:0">' + X.values.map(function (v) {
          return '<li class="rv"><b>' + esc(v) + "</b><span>" + esc(VALUE_NOTE[v] || "") + "</span></li>";
        }).join("") + "</ul></div></section>" +
        '<section class="block"><div class="block-h"><div><h2>Acknowledgement</h2><p>Grants and scholarships that support our work.</p></div><ul class="ack">' +
        ACK.map(function (a) { return "<li>" + esc(a) + "</li>"; }).join("") + "</ul></div></section>");
  }

  /* ---------- motion ---------- */
  var io = null, dotIo = null, parEls = [];
  function reveal(scope) {
    if (io) io.disconnect();
    if (!animate) return;
    io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.18, rootMargin: "0px 0px -6% 0px" });
    scope.querySelectorAll(".scene").forEach(function (s) { if (!s.classList.contains("in")) io.observe(s); });
    scope.querySelectorAll(".page .rv").forEach(function (el, i) { el.style.setProperty("--d", String(i % 4)); io.observe(el); });
    /* safety net: nothing at or above the fold may stay hidden */
    setTimeout(function () {
      scope.querySelectorAll(".scene:not(.in), .page .rv:not(.in)").forEach(function (el) {
        if (el.getBoundingClientRect().top < innerHeight * 1.05) el.classList.add("in");
      });
    }, 1400);
  }
  function buildDots() {
    var dots = $("dots"), scenes = document.querySelectorAll("#view .scene");
    dots.innerHTML = Array.prototype.map.call(scenes, function (s) {
      return '<a href="#' + s.id + '" data-s="' + s.id + '"><span>' + esc(s.dataset.name) + "</span><i></i></a>";
    }).join("");
    if (dotIo) dotIo.disconnect();
    if (!canObserve) return;
    dotIo = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        dots.querySelectorAll("a").forEach(function (a) { a.classList.toggle("on", a.dataset.s === e.target.id); });
        dots.classList.toggle("on-light", !e.target.classList.contains("dark"));
      });
    }, { rootMargin: "-45% 0px -45% 0px" });
    scenes.forEach(function (s) { dotIo.observe(s); });
  }
  function countUp(scope) {
    if (!animate) return;
    scope.querySelectorAll("[data-n]").forEach(function (el) {
      var end = +el.dataset.n, start = Date.now() + 900, dur = 1300, done = false;
      el.textContent = "0";
      (function tick() {
        if (done) return;
        var k = Math.min(1, Math.max(0, (Date.now() - start) / dur));
        el.textContent = String(Math.round(end * (1 - Math.pow(1 - k, 3))));
        if (k < 1) requestAnimationFrame(tick);
      })();
      setTimeout(function () { done = true; el.textContent = String(end); }, 2600);
    });
  }
  var ticking = false;
  function onScroll() {
    $("head").classList.toggle("solid", window.scrollY > 60 || sheet.classList.contains("open"));
    if (!animate || ticking || !parEls.length) return;
    ticking = true;
    requestAnimationFrame(function () {
      var vh = innerHeight;
      parEls.forEach(function (el) {
        var host = el.closest(".scene") || el;
        var r = host.getBoundingClientRect();
        if (r.bottom < -100 || r.top > vh + 100) return;
        var off = (r.top + r.height / 2 - vh / 2) * parseFloat(el.dataset.par);
        el.style.transform = "translate3d(0," + off.toFixed(1) + "px,0)";
      });
      ticking = false;
    });
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll);

  /* in-page anchors on the home view must not be read as routes */
  document.addEventListener("click", function (e) {
    var a = e.target.closest('a[href^="#s-"]');
    if (!a) return;
    var target = document.getElementById(a.getAttribute("href").slice(1));
    if (!target) return;
    e.preventDefault();
    target.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
  });

  /* ---------- router ---------- */
  var TITLES = { "": "Home", research: "Research", people: "People", publications: "Publications", news: "News", videos: "Videos", join: "Join us", mission: "Mission", projects: "Project sites" };
  function draw(route) {
    var parts = route.replace(/^#\/?/, "").split("/").filter(Boolean);
    var name = parts[0] || "", html;
    if (name === "research") html = parts[1] ? viewTheme(parts[1]) : viewResearch();
    else if (name === "people") html = viewPeople();
    else if (name === "publications") html = viewPubs();
    else if (name === "news") html = viewNews();
    else if (name === "videos") html = viewVideos();
    else if (name === "join") html = viewJoin();
    else if (name === "mission") html = viewMission();
    else if (name === "projects") html = viewProjects();
    else { name = ""; html = home(); }
    var view = $("view");
    root.classList.toggle("home-view", name === "");
    view.innerHTML = html;
    var sub = name === "research" && parts[1] && themeById[parts[1]] ? themeById[parts[1]].title : TITLES[name];
    document.title = (name === "" ? "" : sub + " | ") + "XAMI Lab: Explainable Analytics for Machine Intelligence";
    markNav("#/" + name);
    window.scrollTo(0, 0);
    parEls = animate ? Array.prototype.slice.call(view.querySelectorAll("[data-par]")).filter(function (el) { return !el.classList.contains("bg"); }) : [];
    if (name === "") { buildDots(); countUp(view); }
    if (name === "publications") wirePubs();
    reveal(view);
    onScroll();
  }
  var first = true;
  function go() {
    var route = location.hash || "#/";
    if (!/^#\//.test(route) && route !== "#") return; /* plain anchors are handled by the browser */
    var view = $("view");
    if (first || reduce) { first = false; draw(route); return; }
    view.classList.add("leaving");
    setTimeout(function () { draw(route); view.classList.remove("leaving"); view.focus({ preventScroll: true }); }, 240);
  }
  window.addEventListener("hashchange", go);

  buildNav();
  buildFoot();
  go();
})();
</script>
<script src="assets/mock-bar.js"></script>
</body>
</html>
