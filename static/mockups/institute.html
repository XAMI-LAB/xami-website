<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>XAMI Lab, Queensland University of Technology</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Schibsted+Grotesk:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      document.documentElement.className = "js";
    </script>
    <style>
      :root {
        --ground: #f3f7fb;
        --paper: #ffffff;
        --ink: #0c2233;
        --soft: #4b6275;
        --line: #d7e1ea;
        --blue: #1e8fe1;
        --blue-deep: #0f5fa3;
        --teal: #12b5a0;
        --teal-deep: #0a7d6f;
        --deep: #2a1e5c;
        --deep-2: #3a2b7a;
        --mint: #e2f4f1;
        --sky: #e4effb;
        --sun: #ffb84d;
        --night: #0a1a2c;
        --display: "Schibsted Grotesk", "Public Sans", system-ui, sans-serif;
        --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        --r-xl: 40px;
        --r-lg: 28px;
        --r-md: 20px;
        --shadow: 0 1px 2px rgba(12, 34, 51, 0.05), 0 12px 32px -12px rgba(12, 34, 51, 0.18);
        --shadow-lift: 0 2px 4px rgba(12, 34, 51, 0.06), 0 24px 48px -16px rgba(12, 34, 51, 0.28);
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: var(--ground);
        color: var(--ink);
        font: 400 17px/1.6 var(--body);
        -webkit-font-smoothing: antialiased;
      }
      img { max-width: 100%; display: block; }
      a { color: inherit; }
      h1, h2, h3, h4 { font-family: var(--display); margin: 0; letter-spacing: -0.02em; line-height: 1.1; }
      p { margin: 0; }
      ul { margin: 0; padding: 0; list-style: none; }
      button { font: inherit; color: inherit; cursor: pointer; }
      :focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; border-radius: 6px; }
      .wrap { max-width: 1340px; margin: 0 auto; padding: 0 24px; }
      .skip { position: absolute; left: -999px; top: 8px; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; border: 0; z-index: 100; }
      .skip:focus { left: 16px; }

      /* Header */
      .top {
        position: sticky; top: 0; z-index: 60;
        background: rgba(243, 247, 251, 0.84);
        -webkit-backdrop-filter: saturate(1.4) blur(14px);
        backdrop-filter: saturate(1.4) blur(14px);
        border-bottom: 1px solid transparent;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .top.stuck { border-color: var(--line); box-shadow: 0 8px 24px -18px rgba(12, 34, 51, 0.4); }
      .top .wrap { display: flex; align-items: center; gap: 28px; height: 78px; }
      .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; flex: none; }
      .brand img { width: 44px; height: auto; }
      .brand b { font: 800 21px/1 var(--display); letter-spacing: -0.02em; display: block; }
      .brand small { display: block; font-size: 12.5px; color: var(--soft); margin-top: 4px; }
      .nav { display: flex; align-items: center; gap: 2px; margin-left: auto; }
      .nav a {
        text-decoration: none; font-weight: 500; font-size: 15.5px; padding: 9px 13px; border-radius: 999px;
        transition: background 0.18s, color 0.18s;
      }
      .nav a:hover { background: #e3ebf3; }
      .nav a[aria-current="page"] { background: var(--ink); color: #fff; }
      .nav a.cta { background: linear-gradient(100deg, var(--blue), var(--teal)); color: #fff; font-weight: 600; margin-left: 8px; padding: 10px 18px; }
      .nav a.cta:hover { filter: brightness(1.06); }
      .nav a.cta[aria-current="page"] { box-shadow: 0 0 0 3px var(--ink) inset; }
      .menu-btn { display: none; margin-left: auto; background: var(--ink); color: #fff; border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: 15px; }

      /* View transition and reveals */
      #view { min-height: 60vh; }
      .js #view { opacity: 0; transform: translateY(10px); transition: opacity 0.4s ease, transform 0.4s ease; }
      .js #view.show { opacity: 1; transform: none; }
      .js .rv { opacity: 0; transform: translateY(26px); transition: opacity 0.8s cubic-bezier(0.2, 0.7, 0.2, 1), transform 0.8s cubic-bezier(0.2, 0.7, 0.2, 1); transition-delay: var(--d, 0ms); }
      .js .rv.in { opacity: 1; transform: none; }

      /* Buttons */
      .btn {
        display: inline-flex; align-items: center; gap: 10px; text-decoration: none; border: 0;
        font: 600 16px/1 var(--body); padding: 16px 26px; border-radius: 999px;
        transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
      }
      .btn:hover { transform: translateY(-2px); }
      .btn svg { width: 18px; height: 18px; flex: none; transition: transform 0.2s; }
      .btn:hover svg { transform: translateX(3px); }
      .btn.white { background: #fff; color: var(--ink); box-shadow: 0 10px 24px -10px rgba(0, 0, 0, 0.5); }
      .btn.ghost { background: rgba(255, 255, 255, 0.12); color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.75); }
      .btn.ghost:hover { background: rgba(255, 255, 255, 0.22); }
      .btn.dark { background: var(--ink); color: #fff; }
      .btn.line { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
      .btn.line:hover { background: var(--ink); color: #fff; }
      .btn.teal { background: #7ff0dd; color: #0b2a3a; }
      .btn.small { padding: 11px 18px; font-size: 14.5px; }

      /* Hero */
      .hero {
        position: relative; margin-top: 10px; border-radius: var(--r-xl); overflow: hidden; color: #fff;
        min-height: min(660px, 78vh); display: grid; align-items: end; isolation: isolate;
        box-shadow: var(--shadow-lift);
      }
      .hero .photo { position: absolute; inset: 0; z-index: -2; background: #24465f url("assets/brisbane.jpg") center 42% / cover no-repeat; animation: drift 28s ease-in-out infinite alternate; }
      @keyframes drift { from { transform: scale(1.04) translateX(-1%); } to { transform: scale(1.14) translateX(2%); } }
      .hero::before {
        content: ""; position: absolute; inset: 0; z-index: -1;
        background:
          linear-gradient(98deg, rgba(10, 22, 52, 0.92) 0%, rgba(20, 30, 88, 0.72) 38%, rgba(18, 100, 140, 0.18) 72%, rgba(18, 181, 160, 0) 100%),
          linear-gradient(0deg, rgba(8, 18, 40, 0.7) 0%, rgba(8, 18, 40, 0) 45%);
      }
      .hero-in { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 0.8fr); gap: 40px; align-items: end; padding: 64px 60px 56px; }
      .place { display: inline-flex; align-items: center; gap: 10px; font-weight: 500; font-size: 15px; background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.3); padding: 8px 16px 8px 10px; border-radius: 999px; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
      .place i { width: 26px; height: 26px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
      .place i img { width: 18px; }
      .hero h1 { font-size: clamp(38px, 5.4vw, 78px); font-weight: 800; letter-spacing: -0.035em; line-height: 1; margin: 22px 0 22px; max-width: 13ch; }
      .hero .lede { font-size: clamp(17px, 1.5vw, 21px); line-height: 1.5; max-width: 54ch; color: rgba(255, 255, 255, 0.92); }
      .hero .acts { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 32px; }
      .glass {
        background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.32); border-radius: var(--r-lg);
        -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3);
        padding: 22px 24px; text-decoration: none; display: block; transition: transform 0.25s, background 0.25s;
      }
      a.glass:hover { transform: translateY(-4px); background: rgba(255, 255, 255, 0.22); }
      .glass .k { font-size: 13.5px; font-weight: 600; color: #a9f3e6; display: flex; align-items: center; gap: 8px; }
      .glass .k::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #7ff0dd; box-shadow: 0 0 0 0 rgba(127, 240, 221, 0.7); animation: pulse 2.4s infinite; }
      @keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(127, 240, 221, 0); } 100% { box-shadow: 0 0 0 0 rgba(127, 240, 221, 0); } }
      .glass h3 { font-size: 19px; line-height: 1.25; margin: 10px 0 8px; letter-spacing: -0.01em; }
      .glass p { font-size: 14.5px; color: rgba(255, 255, 255, 0.85); }

      /* News strip */
      .strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 18px; }
      .tile {
        background: var(--paper); border-radius: var(--r-md); padding: 20px 22px 20px; text-decoration: none; display: grid;
        grid-template-columns: 1fr auto; gap: 8px 14px; align-content: start; border: 1px solid var(--line);
        transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
      }
      .tile:hover { transform: translateY(-5px); box-shadow: var(--shadow-lift); border-color: transparent; }
      .tile .meta { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--soft); }
      .tile h3 { font-size: 17.5px; line-height: 1.25; letter-spacing: -0.01em; }
      .tile p { grid-column: 1 / -1; font-size: 14.5px; color: var(--soft); line-height: 1.45; }
      .badge { font: 600 12.5px/1 var(--body); padding: 6px 10px; border-radius: 999px; background: var(--sky); color: var(--blue-deep); white-space: nowrap; }
      .badge.People { background: var(--mint); color: var(--teal-deep); }
      .badge.Graduation { background: #fff0d6; color: #8a5300; }
      .badge.Paper { background: #ebe7fb; color: #4a3aa8; }

      /* Faces */
      .face { position: relative; display: inline-grid; place-items: center; overflow: hidden; flex: none; background: linear-gradient(135deg, #cfe6fa, #c9f0e9); color: #1b5270; font: 700 15px/1 var(--display); border-radius: 50%; width: 44px; height: 44px; }
      .face img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .faces { display: flex; }
      .faces .face { box-shadow: 0 0 0 3px var(--paper); }
      .faces .face + .face { margin-left: -12px; }

      /* Numbers */
      .numbers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin: 56px 0 28px; }
      .numbers li { padding: 6px 28px; border-left: 1px solid var(--line); }
      .numbers li:first-child { border-left: 0; padding-left: 8px; }
      .numbers b { display: block; font: 800 clamp(44px, 5.4vw, 80px)/1 var(--display); letter-spacing: -0.04em; background: linear-gradient(100deg, var(--blue-deep), var(--teal)); -webkit-background-clip: text; background-clip: text; color: transparent; font-variant-numeric: tabular-nums; }
      .numbers span { display: block; margin-top: 8px; color: var(--soft); font-size: 16px; max-width: 22ch; }

      /* Blocks */
      .block { border-radius: var(--r-xl); padding: 76px 60px 72px; margin: 28px 0; position: relative; overflow: hidden; }
      .block.deep { background: var(--deep); color: #fff; }
      .block.deep::after { content: ""; position: absolute; right: -180px; top: -220px; width: 620px; height: 620px; border-radius: 50%; background: radial-gradient(closest-side, rgba(30, 143, 225, 0.5), rgba(30, 143, 225, 0)); pointer-events: none; }
      .block.mint { background: var(--mint); }
      .block.paper { background: var(--paper); border: 1px solid var(--line); }
      .block.sky { background: var(--sky); }
      .block.grad { background: linear-gradient(118deg, #1268c4 0%, #1790c8 45%, #12b5a0 100%); color: #fff; }
      .bhead { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px 56px; align-items: end; margin-bottom: 44px; position: relative; z-index: 1; }
      .bhead h2 { font-size: clamp(38px, 4.6vw, 66px); font-weight: 800; letter-spacing: -0.035em; display: flex; align-items: baseline; gap: 20px; }
      .bhead h2 .n { font: 500 0.5em/1 var(--display); letter-spacing: 0; opacity: 0.6; font-variant-numeric: tabular-nums; }
      .bhead p { font-size: clamp(17px, 1.45vw, 20.5px); line-height: 1.5; max-width: 52ch; }
      .block.deep .bhead h2 { color: #9fe9ff; }
      .block.deep .bhead p { color: rgba(255, 255, 255, 0.9); }
      .block.mint .bhead h2 { color: #0a5e55; }
      .block.paper .bhead h2, .block.sky .bhead h2 { color: var(--blue-deep); }
      .bfoot { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 40px; position: relative; z-index: 1; }
      .arrows { display: flex; gap: 10px; margin-left: auto; }
      .arrows button { width: 52px; height: 52px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, 0.16); color: inherit; display: grid; place-items: center; transition: background 0.2s, transform 0.2s; }
      .arrows button:hover { background: rgba(255, 255, 255, 0.32); transform: scale(1.06); }
      .block.mint .arrows button { background: rgba(10, 94, 85, 0.12); }
      .block.mint .arrows button:hover { background: rgba(10, 94, 85, 0.24); }
      .arrows svg { width: 20px; height: 20px; }

      /* Rails */
      .rail { display: flex; gap: 24px; overflow-x: auto; scroll-snap-type: x proximity; padding: 8px 60px 26px; margin: -8px -60px 0; scrollbar-width: none; position: relative; z-index: 1; scroll-padding-left: 60px; }
      .rail::-webkit-scrollbar { display: none; }
      .rail > * { scroll-snap-align: start; flex: none; }

      /* Theme cards */
      .tcard { width: min(440px, 82vw); background: #fff; color: var(--ink); border-radius: var(--r-lg); overflow: hidden; text-decoration: none; display: flex; flex-direction: column; transition: transform 0.3s cubic-bezier(0.2, 0.7, 0.2, 1), box-shadow 0.3s; box-shadow: 0 18px 40px -22px rgba(0, 0, 0, 0.7); }
      .tcard:hover { transform: translateY(-8px) rotate(-0.4deg); box-shadow: 0 30px 60px -24px rgba(0, 0, 0, 0.8); }
      .tcard .pic { height: 230px; background: #fff; border-bottom: 4px solid var(--tc); padding: 18px; display: grid; place-items: center; overflow: hidden; }
      .tcard .pic img { max-height: 100%; width: auto; max-width: 100%; object-fit: contain; transition: transform 0.5s; }
      .tcard:hover .pic img { transform: scale(1.06); }
      .tcard .txt { padding: 24px 26px 26px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
      .tcard h3 { font-size: 23px; line-height: 1.15; }
      .tcard p { font-size: 15.5px; color: var(--soft); line-height: 1.5; }
      .tcard .more { margin-top: auto; padding-top: 12px; display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 15px; color: var(--td); }
      .tcard .more i { width: 38px; height: 38px; border-radius: 50%; background: var(--tt); display: grid; place-items: center; transition: background 0.2s, color 0.2s, transform 0.2s; }
      .tcard .more svg { width: 16px; height: 16px; }
      .tcard:hover .more i { background: var(--tc); color: #fff; transform: translateX(4px); }

      /* People */
      .leaders { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; position: relative; z-index: 1; }
      .leader { background: #fff; border-radius: var(--r-lg); padding: 22px; display: grid; grid-template-columns: 190px 1fr; gap: 26px; align-items: center; text-decoration: none; transition: transform 0.25s, box-shadow 0.25s; }
      .leader:hover { transform: translateY(-5px); box-shadow: var(--shadow-lift); }
      .leader .face { width: 190px; height: 210px; border-radius: 22px; font-size: 40px; }
      .leader .role { font-size: 13.5px; font-weight: 600; color: var(--teal-deep); }
      .leader h3 { font-size: 27px; margin: 8px 0 8px; }
      .leader p { color: var(--soft); font-size: 15.5px; line-height: 1.45; }
      .leader .count { margin-top: 14px; font-size: 14.5px; font-weight: 600; }
      .subhead { font: 700 20px/1.2 var(--display); margin: 44px 0 18px; letter-spacing: -0.01em; position: relative; z-index: 1; }
      .member { width: 176px; text-decoration: none; }
      .member .face { width: 176px; height: 196px; border-radius: 22px; font-size: 34px; transition: transform 0.3s; }
      .member .face img { transition: transform 0.5s; }
      .member:hover .face img { transform: scale(1.07); }
      .member b { display: block; font: 700 16px/1.25 var(--display); margin-top: 12px; }
      .member span { display: block; font-size: 13.5px; color: var(--soft); line-height: 1.35; margin-top: 4px; }

      /* Publications */
      .pubs { border-top: 1px solid var(--line); position: relative; z-index: 1; }
      .pub { display: grid; grid-template-columns: 132px minmax(0, 1fr) auto; gap: 8px 26px; align-items: center; padding: 22px 12px; border-bottom: 1px solid var(--line); border-radius: 14px; transition: background 0.2s; }
      .pub:hover { background: #f4f8fc; }
      .thumb { width: 132px; height: 92px; border-radius: 14px; overflow: hidden; flex: none; }
      .thumb svg { width: 100%; height: 100%; display: block; }
      .pub h3 { font: 700 19px/1.3 var(--display); letter-spacing: -0.01em; }
      .pub h3 a { text-decoration: none; background: linear-gradient(currentColor, currentColor) 0 100% / 0 2px no-repeat; transition: background-size 0.3s; }
      .pub h3 a:hover { background-size: 100% 2px; }
      .pub .who { font-size: 15px; color: var(--soft); margin-top: 6px; }
      .pub .who b { color: var(--ink); font-weight: 600; }
      .pub .where { font-size: 14.5px; margin-top: 6px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
      .pub .where em { color: var(--soft); }
      .chip { font: 600 12.5px/1 var(--body); padding: 6px 10px; border-radius: 999px; background: var(--tt); color: var(--td); text-decoration: none; white-space: nowrap; }
      .links { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
      .links a { font: 600 13.5px/1 var(--body); text-decoration: none; padding: 9px 14px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--line); transition: background 0.2s, color 0.2s, box-shadow 0.2s; white-space: nowrap; }
      .links a:hover { background: var(--ink); color: #fff; box-shadow: none; }

      /* Videos */
      .videos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; position: relative; z-index: 1; }
      .video { text-decoration: none; display: block; }
      .video .shot { position: relative; border-radius: var(--r-md); overflow: hidden; aspect-ratio: 16 / 9; background: #10283c; }
      .video .shot img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s, filter 0.3s; }
      .video:hover .shot img { transform: scale(1.06); filter: brightness(0.8); }
      .video .play { position: absolute; left: 16px; bottom: 16px; width: 54px; height: 54px; border-radius: 50%; background: #fff; color: var(--ink); display: grid; place-items: center; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); transition: transform 0.25s; }
      .video:hover .play { transform: scale(1.12); }
      .video .play svg { width: 20px; height: 20px; margin-left: 3px; }
      .video b { display: block; font: 700 17.5px/1.3 var(--display); margin-top: 14px; }
      .video span { display: block; font-size: 14.5px; color: var(--soft); margin-top: 4px; }

      /* Join */
      .options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; position: relative; z-index: 1; }
      .option { background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: var(--r-md); padding: 26px; transition: transform 0.25s, background 0.25s; }
      .option:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.22); }
      .option h3 { font-size: 21px; margin-bottom: 8px; }
      .option p { font-size: 15.5px; color: rgba(255, 255, 255, 0.92); }
      .option .ic { width: 46px; height: 46px; border-radius: 14px; background: #fff; color: var(--blue-deep); display: grid; place-items: center; margin-bottom: 18px; }
      .option .ic svg { width: 24px; height: 24px; }

      /* Project sites */
      .sites { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
      .site { display: block; text-decoration: none; border: 1.5px dashed #9fb4c6; border-radius: var(--r-md); padding: 22px 24px; background: transparent; transition: background 0.2s, border-color 0.2s, transform 0.2s; }
      .site:hover { background: #fff; border-color: var(--ink); transform: translateY(-3px); }
      .site .ext { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--soft); }
      .site .ext svg { width: 13px; height: 13px; }
      .site b { display: block; font: 700 19px/1.2 var(--display); margin: 10px 0 4px; }
      .site p { font-size: 14.5px; color: var(--soft); }
      .site code { display: block; margin-top: 12px; font: 500 14px/1 var(--body); color: var(--blue-deep); }
      .section { padding: 40px 8px 28px; }
      .section > h2 { font-size: 30px; margin-bottom: 8px; }
      .section > p { color: var(--soft); max-width: 62ch; margin-bottom: 26px; }

      /* Inner pages */
      .phead { border-radius: var(--r-xl); padding: 64px 60px 56px; margin-top: 10px; background: var(--deep); color: #fff; position: relative; overflow: hidden; }
      .phead::after { content: ""; position: absolute; right: -140px; bottom: -260px; width: 640px; height: 640px; border-radius: 50%; background: radial-gradient(closest-side, rgba(18, 181, 160, 0.55), rgba(18, 181, 160, 0)); pointer-events: none; }
      .phead.t { background: var(--td); }
      .phead.t::after { background: radial-gradient(closest-side, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0)); }
      .crumb { font-size: 14.5px; display: flex; gap: 8px; align-items: center; color: rgba(255, 255, 255, 0.8); position: relative; z-index: 1; }
      .crumb a { text-decoration: underline; text-underline-offset: 3px; }

    <script src="assets/data.js"></script>
    <script src="assets/mock-bar.js"></script>
    <script>
      (function () {
        "use strict";
        var X = window.XAMI;
        var view = document.getElementById("view");
        var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        /* ---------- helpers ---------- */
        function esc(s) {
          return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
          });
        }
        function plain(s) {
          return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
        }
        var ICON = {
          arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
          back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
          ext: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
          play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>',
          cap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c2 2 10 2 12 0v-4.5M22 9v6"/></svg>',
          globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>',
          hands: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h4l4-3 4 3h6v8h-3l-4 3-3-2-2 1-3-2H3z"/><path d="M9 12l3 2 3-2"/></svg>'
        };
        var TC = {
          process: { c: "#1E8FE1", t: "#E3F0FC", d: "#0F5FA3" },
          causal: { c: "#6C5CE7", t: "#ECE9FD", d: "#4333B5" },
          persuasive: { c: "#F2994A", t: "#FDEEDD", d: "#9A4E0B" },
          medical: { c: "#12B5A0", t: "#DDF5F1", d: "#0A7267" }
        };
        function tstyle(id) {
          var t = TC[id] || { c: "#8EA2B3", t: "#EEF3F8", d: "#3D5568" };
          return "--tc:" + t.c + ";--tt:" + t.t + ";--td:" + t.d;
        }
        var themeById = {};
        X.themes.forEach(function (t) { themeById[t.id] = t; });

        var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        function when(d, short) {
          var s = String(d).split("-");
          if (!s[1]) return s[0];
          var m = MONTHS[+s[1] - 1];
          return (short ? m.slice(0, 3) : m) + " " + s[0];
        }

        /* ---------- people and papers ---------- */
        function parts(name) {
          var w = name.replace(/\(.*?\)/g, " ").replace(/\b(A\/Prof|Prof|Dr|Eng)\.?\s/g, " ").trim().split(/\s+/);
          return { first: w[0], last: w[w.length - 1] };
        }
        var people = X.people.slice().sort(function (a, b) { return a.order - b.order; });
        var byId = {};
        people.forEach(function (p) {
          var n = parts(p.name);
          p.first = n.first;
          p.last = n.last;
          p.initials = (n.first[0] + n.last[0]).toUpperCase();
          p.papers = [];
          p.counts = {};
          var y = /(\d{4})/.exec(p.role);
          p.year = p.group === "Alumni" && y ? y[1] : "";
          byId[p.id] = p;
        });
        X.pubs.forEach(function (pub) {
          pub.lab = [];
          pub.authors.forEach(function (a) {
            var w = a.trim().split(/\s+/);
            people.forEach(function (p) {
              if (plain(w[w.length - 1]) === plain(p.last) && plain(w[0])[0] === plain(p.first)[0] && pub.lab.indexOf(p) < 0) {
                pub.lab.push(p);
                p.papers.push(pub);
                p.counts[pub.theme] = (p.counts[pub.theme] || 0) + 1;
              }
            });
          });
        });
        function inGroup(g) { return people.filter(function (p) { return p.group === g; }); }
        function themePubs(id) { return X.pubs.filter(function (p) { return p.theme === id; }); }
        function themePeople(id) {
          return people.filter(function (p) { return p.counts[id]; }).sort(function (a, b) { return b.counts[id] - a.counts[id]; });
        }

        function face(p, extra) {
          return '<span class="face ' + (extra || "") + '" title="' + esc(p.name) + '"><span aria-hidden="true">' + esc(p.initials) +
            '</span><img src="' + esc(p.photo) + '" alt="" loading="lazy" onerror="this.remove()" /></span>';
        }
        function personLink(p, inner, cls) {
          return p.url
            ? '<a class="' + cls + '" href="' + esc(p.url) + '" target="_blank" rel="noopener">' + inner + "</a>"
            : '<div class="' + cls + '">' + inner + "</div>";
        }
        function member(p) {
          var role = p.year ? p.role.replace(/,?\s*\d{4}/, "") : p.role;
          return personLink(p, face(p) + "<b>" + esc(p.name) + "</b><span>" + esc(role) + "</span>" +
            (p.year ? '<span class="year">Graduated ' + esc(p.year) + "</span>" : ""), "member");
        }

        /* Generated picture for a paper, in the colour of its theme */
        function rng(str) {
          var h = 2166136261;
          for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
          return function () { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 10000) / 10000; };
        }
        function thumb(pub) {
          var t = TC[pub.theme] || TC.process, r = rng(pub.key || pub.title), pts = [], s = "", i;
          for (i = 0; i < 7; i++) pts.push([12 + (i * 108) / 6 + (r() - 0.5) * 14, 16 + r() * 60]);
          s += '<rect width="132" height="92" fill="' + t.t + '"/>';
          s += '<circle cx="' + (30 + r() * 72) + '" cy="' + (20 + r() * 50) + '" r="' + (26 + r() * 16) + '" fill="' + t.c + '" opacity=".14"/>';
          for (i = 0; i < pts.length - 1; i++) {
            s += '<line x1="' + pts[i][0].toFixed(1) + '" y1="' + pts[i][1].toFixed(1) + '" x2="' + pts[i + 1][0].toFixed(1) + '" y2="' + pts[i + 1][1].toFixed(1) + '" stroke="' + t.c + '" stroke-width="2.4" stroke-linecap="round"/>';
          }
          var a = Math.floor(r() * 3), b = 4 + Math.floor(r() * 3);
          s += '<line x1="' + pts[a][0].toFixed(1) + '" y1="' + pts[a][1].toFixed(1) + '" x2="' + pts[b][0].toFixed(1) + '" y2="' + pts[b][1].toFixed(1) + '" stroke="' + t.d + '" stroke-width="1.6" stroke-dasharray="3 4" opacity=".7"/>';
          var fill = Math.floor(r() * pts.length);
          pts.forEach(function (p, k) {
            s += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + (k === fill ? 7 : 5) + '" fill="' + (k === fill ? t.c : "#fff") + '" stroke="' + t.c + '" stroke-width="2.4"/>';
          });
          return '<span class="thumb"><svg viewBox="0 0 132 92" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' + s + "</svg></span>";
        }
        function link(u) { return /^https?:/.test(u) ? u : "https://doi.org/" + u; }
        function pubRow(pub) {
          var t = themeById[pub.theme];
          var names = pub.authors.slice(0, 7).map(function (a) {
            var w = a.trim().split(/\s+/);
            var mine = pub.lab.some(function (p) { return plain(p.last) === plain(w[w.length - 1]) && plain(p.first)[0] === plain(w[0])[0]; });
            return mine ? "<b>" + esc(a) + "</b>" : esc(a);
          }).join(", ") + (pub.authors.length > 7 ? " and " + (pub.authors.length - 7) + " more" : "");
          var main = pub.doi ? link(pub.doi) : pub.url || "";
          var title = main ? '<a href="' + esc(main) + '" target="_blank" rel="noopener">' + esc(pub.title) + "</a>" : esc(pub.title);
          var links = "";
          if (pub.doi) links += '<a href="' + esc(link(pub.doi)) + '" target="_blank" rel="noopener">Read paper</a>';
          else if (pub.url) links += '<a href="' + esc(pub.url) + '" target="_blank" rel="noopener">Read paper</a>';
          if (pub.code) links += '<a href="' + esc(pub.code) + '" target="_blank" rel="noopener">Code</a>';
          return '<li class="pub" style="' + tstyle(pub.theme) + '">' + thumb(pub) + "<div><h3>" + title + '</h3><p class="who">' + names +
            '</p><p class="where">' + (pub.venue ? "<em>" + esc(pub.venue) + "</em>" : "") + "<span>" + esc(pub.year) + "</span>" +
            (t ? '<a class="chip" href="#/research/' + esc(t.id) + '">' + esc(t.short) + "</a>" : "") + '</p></div><div class="links">' + links + "</div></li>";
        }

          el.done = true;
          var start = Date.now(), len = 1400;
          var t = setInterval(function () {
            var k = Math.min(1, (Date.now() - start) / len);
            el.textContent = Math.round(end * (1 - Math.pow(1 - k, 3)));
            if (k >= 1) clearInterval(t);
          }, 30);
          setTimeout(function () { clearInterval(t); el.textContent = end; }, len + 200);
        }
        function motion() {
          if (io) io.disconnect();
          clearTimeout(revealTimer);

          if (reduce || !("IntersectionObserver" in window)) { showAll(); return; }
          io = new IntersectionObserver(function (entries) {
            entries.forEach(function (e) {
              if (!e.isIntersecting) return;
              e.target.classList.add("in");
              var n = e.target.querySelector("[data-count]");
              if (n) count(n);
              io.unobserve(e.target);
            });

          Array.prototype.forEach.call(els, function (el) { io.observe(el); });
          /* Nothing stays hidden if scrolling never happens */
          revealTimer = setTimeout(showAll, 2600);

          });
          return { path: bits[0].split("/").filter(Boolean), query: query };

            var rail = document.getElementById(b.getAttribute("data-rail"));
            var card = rail.firstElementChild;
            var step = card ? card.getBoundingClientRect().width + 24 : 300;
            rail.scrollBy({ left: step * +b.getAttribute("data-dir") * (rail.id === "rail-people" ? 3 : 1), behavior: reduce ? "auto" : "smooth" });
            return;
          }
          var t = e.target.closest("#pt button");
          if (t) {
            pubState.theme = t.getAttribute("data-theme");
            Array.prototype.forEach.call(document.querySelectorAll("#pt button"), function (x) {
              x.setAttribute("aria-pressed", String(x === t));
            });
            drawPubs();
          }
        });
        view.addEventListener("input", function (e) {
          if (e.target.id === "pq") { pubState.q = e.target.value; drawPubs(); }
        });
        view.addEventListener("change", function (e) {
          if (e.target.id === "py") { pubState.year = e.target.value; drawPubs(); }
        });

        window.addEventListener("hashchange", render);
        render();
        /* Last resort so the page is never left blank */
        setTimeout(function () { view.classList.add("show"); }, 1500);
      })();
    </script>
  </body>
</html>
