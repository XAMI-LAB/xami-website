<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>XAMI Lab, explainable analytics for machine intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ground: #f3f5f8;
        --surface: #ffffff;
        --sunk: #e9edf2;
        --ink: #10222e;
        --soft: #55687a;
        --line: #dce3ea;
        --blue: #2aa7f5;
        --teal: #16c8a4;
        --link: #0d6fb3;
        --night: #0e1d28;
        --shadow: 0 1px 2px rgba(16, 34, 46, 0.05), 0 10px 30px -18px rgba(16, 34, 46, 0.35);
        --lift: 0 2px 4px rgba(16, 34, 46, 0.06), 0 26px 50px -24px rgba(16, 34, 46, 0.5);
        --c-process: #1478c4;
        --t-process: #e2f1fe;
        --c-causal: #5a49d6;
        --t-causal: #eceafe;
        --c-persuasive: #9a6200;
        --t-persuasive: #fdf0d3;
        --c-medical: #0a8a73;
        --t-medical: #daf6ef;
        --radius: 26px;
        --font: "Plus Jakarta Sans", ui-rounded, "Segoe UI", system-ui, sans-serif;
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        --ground: #0b141b;
        --surface: #142029;
        --sunk: #1b2a35;
        --ink: #eaf1f6;
        --soft: #9db0bf;
        --line: #263846;
        --link: #6cc3fb;
        --night: #060d12;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        --lift: 0 26px 50px -24px rgba(0, 0, 0, 0.9);
        --c-process: #74c4fb;
        --t-process: #10304a;
        --c-causal: #aea4ff;
        --t-causal: #25234f;
        --c-persuasive: #f5c65f;
        --t-persuasive: #3a2e12;
        --c-medical: #55e0c0;
        --t-medical: #0e3a33;
        color-scheme: dark;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--ground);
        color: var(--ink);
        font: 400 16px/1.55 var(--font);
        -webkit-font-smoothing: antialiased;
        transition: background 0.3s, color 0.3s;
      }
      img {
        max-width: 100%;
        display: block;
      }
      a {
        color: var(--link);
        text-underline-offset: 3px;
      }
      h1,
      h2,
      h3,
      h4,
      p,
      ul,
      ol {
        margin: 0;
      }
      ul,
      ol {
        padding: 0;
        list-style: none;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 3px;
        border-radius: 8px;
      }
      .wrap {
        width: min(1320px, 100% - 40px);
        margin-inline: auto;
      }
      .skip {
        position: absolute;
        left: -999px;
        top: 8px;
        background: var(--ink);
        color: var(--ground);
        padding: 10px 14px;
        border-radius: 10px;
        z-index: 100;
      }
      .skip:focus {
        left: 12px;
      }

      /* Header */
      .top {
        position: sticky;
        top: 0;
        z-index: 50;
        background: color-mix(in srgb, var(--ground) 82%, transparent);
        backdrop-filter: blur(14px) saturate(1.4);
        -webkit-backdrop-filter: blur(14px) saturate(1.4);
        border-bottom: 1px solid transparent;
        transition: border-color 0.2s;
      }
      .top.scrolled {
        border-color: var(--line);
      }
      .top .wrap {
        display: flex;
        align-items: center;
        gap: 18px;
        height: 72px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--ink);
        text-decoration: none;
        font-weight: 800;
        font-size: 18px;
        letter-spacing: -0.01em;
        margin-right: auto;
      }
      .brand img {
        width: 38px;
        height: 38px;
      }
      .brand small {
        display: block;
        font-weight: 500;
        font-size: 12px;
        color: var(--soft);
        letter-spacing: 0;
        line-height: 1.2;
      }
      .menu {
        display: flex;
        gap: 2px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px;
      }
      .menu a {
        color: var(--ink);
        text-decoration: none;
        font-weight: 600;
        font-size: 14.5px;
        padding: 8px 13px;
        border-radius: 999px;
        white-space: nowrap;
        transition: background 0.15s, color 0.15s;
      }
      .menu a:hover {
        background: var(--sunk);
      }
      .menu a[aria-current="page"] {
        background: var(--ink);
        color: var(--ground);
      }
      .menu a.join {
        background: linear-gradient(100deg, var(--blue), var(--teal));
        color: #06212c;
      }
      .menu a.join[aria-current="page"] {
        box-shadow: 0 0 0 2px var(--ink) inset;
      }
      .round {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--surface);
        display: grid;
        place-items: center;
        cursor: pointer;
        flex: none;
      }
      .round svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .round .moon,
      :root[data-theme="dark"] .round .sun {
        display: none;
      }
      :root[data-theme="dark"] .round .moon {
        display: block;
      }
      #menubtn {
        display: none;
      }

      /* Opening lines */
      .hello {
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
        gap: 24px 56px;
        align-items: end;
        padding: 44px 0 30px;
      }
      .hello h1 {
        font-size: clamp(34px, 4.6vw, 62px);
        line-height: 1.02;
        letter-spacing: -0.035em;
        font-weight: 800;
      }
      .hello h1 span {
        display: block;
        background: linear-gradient(95deg, var(--blue), var(--teal));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        padding-bottom: 0.08em;
        font-size: 0.62em;
        line-height: 1.1;
        letter-spacing: -0.03em;
        margin-top: 6px;
      }
      .hello .at {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 14.5px;
        color: var(--soft);
        margin-bottom: 14px;
      }
      .hello .at i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--teal);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--teal) 25%, transparent);
      }
      .hello p.lead {
        font-size: clamp(17px, 1.5vw, 20px);
        line-height: 1.5;
        color: var(--soft);
        max-width: 56ch;
      }

      /* Tiles */
      .grid {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        grid-auto-rows: minmax(176px, auto);
        gap: 16px;
        grid-template-areas:
          "photo photo photo photo photo photo photo news news news news news"
          "photo photo photo photo photo photo photo news news news news news"
          "t1 t1 t1 t2 t2 t2 t3 t3 t3 t4 t4 t4"
          "t1 t1 t1 t2 t2 t2 t3 t3 t3 t4 t4 t4"
          "paper paper paper paper paper crew crew crew crew nums nums nums"
          "paper paper paper paper paper crew crew crew crew nums nums nums"
          "video video video video join join join join proj proj proj proj"
          "video video video video join join join join part part part part";
        perspective: 1600px;
      }
      .tile {
        position: relative;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 24px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-width: 0;
        box-shadow: var(--shadow);
        transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--up, 0px));
        transition: transform 0.35s cubic-bezier(0.2, 0.7, 0.2, 1), box-shadow 0.35s, border-color 0.2s, background 0.3s;
        will-change: transform;
      }
      .tile.live {
        transition: transform 0.08s linear, box-shadow 0.35s, border-color 0.2s;
      }
      .tile:hover,
      .tile:focus-within {
        --up: -5px;
        box-shadow: var(--lift);
        border-color: color-mix(in srgb, var(--blue) 45%, var(--line));
      }
      .tile .go {
        color: inherit;
        text-decoration: none;
      }
      .tile .go::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        z-index: 1;
      }
      .tile .go:focus-visible {
        outline: none;
      }
      .tile:has(.go:focus-visible) {
        outline: 3px solid var(--blue);
        outline-offset: 3px;
      }
      .tile .over {
        position: relative;
        z-index: 2;
      }
      .kicker {
        font-size: 13.5px;
        font-weight: 700;
        color: var(--soft);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }
      .kicker em {
        font-style: normal;
        font-weight: 600;
        color: var(--link);
      }
      .tile h2,
      .tile h3 {
        font-size: 21px;
        line-height: 1.22;
        letter-spacing: -0.02em;
        font-weight: 700;
      }
      .tile p {
        color: var(--soft);
        font-size: 15px;
      }
      .corner {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--ink);
        color: var(--ground);
        display: grid;
        place-items: center;
        position: absolute;
        right: 18px;
        bottom: 18px;
        transform: scale(0.85);
        opacity: 0;
        transition: opacity 0.25s, transform 0.25s;
      }
      .corner svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .tile:hover .corner,
      .tile:focus-within .corner {
        opacity: 1;
        transform: none;
      }

      .t-photo {
        grid-area: photo;
        padding: 0;
        color: #fff;
        justify-content: flex-end;
        border-color: transparent;
        min-height: 368px;
      }
      .t-photo > img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 38% 50%;
        transform: scale(1.06);
        animation: drift 26s ease-in-out infinite alternate;
      }
      @keyframes drift {
        to {
          transform: scale(1.14) translateX(-2.5%);
        }
      }
      .t-photo::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        background: linear-gradient(180deg, rgba(8, 24, 36, 0.05) 25%, rgba(8, 24, 36, 0.86) 100%);
      }
      .t-photo .text {
        position: relative;
        z-index: 1;
        padding: 28px;
      }
      .t-photo .kicker {
        color: rgba(255, 255, 255, 0.85);
        justify-content: flex-start;
      }
      .t-photo h2 {
        font-size: clamp(21px, 2.1vw, 29px);
        line-height: 1.25;
        font-weight: 600;
        max-width: 30ch;
      }
      .place {
        position: absolute;
        z-index: 1;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.9);
        color: #10222e;
        font-weight: 700;
        font-size: 13px;
        padding: 6px 12px;
        border-radius: 999px;
        backdrop-filter: blur(6px);
      }
      .t-photo .corner {
        background: #fff;
        color: #10222e;
      }

      .t-news {
        grid-area: news;
      }
      .t-news .stage {
        position: relative;
        flex: 1;
        min-height: 190px;
      }
      .t-news .item {
        position: absolute;
        inset: 0;
        opacity: 0;
        transform: translateY(12px);
        transition: opacity 0.5s, transform 0.5s;
        pointer-events: none;
        display: flex;
        flex-direction: column;
      }
      .t-news .item.on {
        opacity: 1;
        transform: none;
      }
      .t-news time {
        font-size: 14px;
        font-weight: 600;
        color: var(--soft);
      }
      .t-news h3 {
        font-size: clamp(22px, 2vw, 28px);
        margin: 8px 0 8px;
      }
      .t-news .who {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        font-weight: 600;
      }
      .dots {
        display: flex;
        gap: 6px;
        margin-top: 14px;
      }
      .dots button {
        all: unset;
        cursor: pointer;
        width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        border-radius: 50%;
      }
      .dots button::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 99px;
        background: var(--line);
        transition: width 0.3s, background 0.3s;
      }
      .dots button[aria-pressed="true"]::before {
        width: 20px;
        background: var(--teal);
      }
      .dots button:focus-visible {
        outline: 3px solid var(--blue);
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 999px;
        background: var(--sunk);
        color: var(--ink);
        white-space: nowrap;
      }
      .tag.th {
        background: var(--t);
        color: var(--c);
      }
      [data-th="process"] {
        --c: var(--c-process);
        --t: var(--t-process);
      }
      [data-th="causal"] {
        --c: var(--c-causal);
        --t: var(--t-causal);
      }
      [data-th="persuasive"] {
        --c: var(--c-persuasive);
        --t: var(--t-persuasive);
      }
      [data-th="medical"] {
        --c: var(--c-medical);
        --t: var(--t-medical);
      }

      .t-theme {
        background: var(--t);
        border-color: color-mix(in srgb, var(--c) 22%, transparent);
        min-height: 368px;
      }
      .t-theme:hover,
      .t-theme:focus-within {
        border-color: var(--c);
      }
      .t-theme .art {
        width: 112px;
        height: 84px;
        margin: -2px 0 auto -4px;
        color: var(--c);
      }
      .t-theme .art svg {
        width: 100%;
        height: 100%;
        overflow: visible;
        fill: none;
        stroke: currentColor;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .t-theme .art .fill {
        fill: currentColor;
        stroke: none;
      }
      .t-theme .art .paper {
        fill: var(--surface);
      }
      .t-theme h3 {
        font-size: 22px;
        margin: 18px 0 8px;
      }
      .t-theme p {
        color: color-mix(in srgb, var(--ink) 78%, var(--c));
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .t-theme .count {
        margin-top: 16px;
        font-weight: 700;
        font-size: 14px;
        color: var(--c);
      }
      .t-theme .corner {
        background: var(--c);
        color: var(--t);
      }
      .t1 {
        grid-area: t1;
      }
      .t2 {
        grid-area: t2;
      }
      .t3 {
        grid-area: t3;
      }
      .t4 {
        grid-area: t4;
      }
      @keyframes travel {
        0%,
        8% {
          offset-distance: 0%;
          opacity: 0;
        }
        14% {
          opacity: 1;
        }
        86% {
          opacity: 1;
        }
        92%,
        100% {
          offset-distance: 100%;
          opacity: 0;
        }
      }
      @keyframes swap {
        0%,
        45% {
          opacity: 1;
        }
        55%,
        100% {
          opacity: 0.18;
        }
      }
      @keyframes grow {
        0%,
        100% {
          transform: scaleX(0.35);
        }
        50% {
          transform: scaleX(1);
        }
      }
      @keyframes ping {
        0% {
          transform: scale(0.5);
          opacity: 0.9;
        }
        100% {
          transform: scale(1.7);
          opacity: 0;
        }
      }
      .a-dot {
        offset-path: path("M14 22 H58 V62 H98");
        animation: travel 3.6s ease-in-out infinite;
      }
      .a-yes {
        animation: swap 3.2s ease-in-out infinite alternate;
      }
      .a-no {
        animation: swap 3.2s ease-in-out infinite alternate-reverse;
      }
      .a-bar {
        transform-origin: 26px 0;
        transform-box: view-box;
        animation: grow 3.4s ease-in-out infinite;
      }
      .a-bar.b2 {
        animation-delay: -1.1s;
      }
      .a-bar.b3 {
        animation-delay: -2.2s;
      }
      .a-ping {
        transform-origin: 74px 44px;
        transform-box: view-box;
        animation: ping 2.4s ease-out infinite;
      }

      .t-paper {
        grid-area: paper;
      }
      .t-paper .body {
        display: grid;
        grid-template-columns: 96px minmax(0, 1fr);
        gap: 18px;
        align-items: start;
        flex: 1;
      }
      .t-paper h3 {
        font-size: 20px;
        margin-bottom: 8px;
      }
      .t-paper .links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 18px;
      }
      .thumb {
        width: 96px;
        aspect-ratio: 1;
        border-radius: 18px;
        background: var(--t);
        color: var(--c);
        flex: none;
        overflow: hidden;
      }
      .thumb svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 14.5px;
        padding: 10px 16px;
        border-radius: 999px;
        text-decoration: none;
        background: var(--ink);
        color: var(--ground);
        border: 1px solid var(--ink);
        cursor: pointer;
        transition: transform 0.15s, background 0.15s;
      }
      .btn:hover {
        transform: translateY(-1px);
      }
      .btn.ghost {
        background: transparent;
        color: var(--ink);
        border-color: var(--line);
      }
      .btn.ghost:hover {
        background: var(--sunk);
      }
      .btn svg {
        width: 15px;
        height: 15px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .face {
        position: relative;
        display: inline-grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        overflow: hidden;
        background: linear-gradient(135deg, var(--blue), var(--teal));
        color: #06212c;
        font-weight: 800;
        font-size: 14px;
        flex: none;
      }
      .face img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .t-crew {
        grid-area: crew;
      }
      .t-crew .stack {
        display: flex;
        flex-wrap: wrap;
        padding-left: 12px;
        margin-bottom: auto;
      }
      .t-crew .stack .face {
        width: 58px;
        height: 58px;
        margin: 0 0 8px -12px;
        border: 3px solid var(--surface);
        transition: transform 0.25s;
      }
      .t-crew:hover .stack .face:nth-child(odd) {
        transform: translateY(-5px);
      }
      .t-crew .stack .more {
        background: var(--sunk);
        color: var(--ink);
      }
      .t-crew h3 {
        font-size: 26px;
        margin: 16px 0 6px;
      }

      .t-nums {
        grid-area: nums;
        padding: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .t-nums div {
        padding: 20px 22px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }
      .t-nums div:nth-child(even) {
        border-right: 0;
      }
      .t-nums div:nth-child(n + 3) {
        border-bottom: 0;
      }
      .t-nums b {
        font-size: clamp(38px, 3.6vw, 54px);
        line-height: 1;
        letter-spacing: -0.04em;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .t-nums span {
        font-size: 14px;
        color: var(--soft);
        font-weight: 600;
        margin-top: 6px;
      }

      .t-video {
        grid-area: video;
        padding: 0;
        color: #fff;
        justify-content: flex-end;
        border-color: transparent;
        min-height: 300px;
      }
      .t-video > img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.36);
        transition: transform 0.6s;
      }
      .t-video:hover > img {
        transform: scale(1.43);
      }
      .t-video::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;

    <script>
      // Pick the appearance before the page paints: ?theme=, then the saved choice, then the system setting.
      (function () {
        var wanted = new URLSearchParams(location.search).get("theme");
        var saved = null;
        try {
          saved = localStorage.getItem("xami-appearance");
        } catch (e) {}
        var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = wanted === "dark" || wanted === "light" ? wanted : saved || (dark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();

        </div>
        <div>
          <h4>Where our researchers work</h4>
          <div class="logos" id="foot-logos"></div>
        </div>
        <div>
          <h4>Explore</h4>
          <ul id="foot-nav"></ul>
        </div>
        <div>
          <h4>Contact</h4>
          <ul>
            <li><a href="#/join">Work with us</a></li>
            <li><a href="#/people">Find a researcher</a></li>
            <li><a href="https://github.com/XAMI-LAB" target="_blank" rel="noopener">XAMI Lab on GitHub</a></li>
            <li>Brisbane, Australia</li>
          </ul>
        </div>
      </div>
    </footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="assets/data.js"></script>
    <script src="assets/mock-bar.js"></script>
    <script>
      (function () {
        "use strict";
        var X = window.XAMI;
        var $ = function (id) {
          return document.getElementById(id);
        };
        var esc = function (s) {
          return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
          });
        };
        var plain = function (s) {
          return String(s)
            .normalize("NFD")
            .replace(/[̀-ͯ]/g, "")
            .toLowerCase();
        };
        var still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
        var months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        var when = function (d) {
          var p = String(d).split("-");
          return p[1] ? months[+p[1] - 1] + " " + p[0] : p[0];
        };
        var ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>';
        var EXT = '<svg class="ext" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
        var PLAY = '<span class="play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg></span>';

        /* ---------- Data ---------- */
        var themeById = {};
        X.themes.forEach(function (t) {
          themeById[t.id] = t;
          t.papers = [];
          t.people = [];
        });
        var people = X.people.slice().sort(function (a, b) {
          return a.order - b.order;
        });
        var byId = {};
        people.forEach(function (p) {
          var words = p.name
            .replace(/\(.*?\)/g, " ")
            .replace(/\b(A\/Prof|Prof|Dr|Eng)\.?\s/g, " ")
            .trim()
            .split(/\s+/);
          p.first = words[0];
          p.last = words[words.length - 1];
          p.initials = (p.first[0] + p.last[0]).toUpperCase();
          p.papers = [];
          p.counts = {};
          var y = /(\d{4})/.exec(p.role);
          p.year = p.group === "Alumni" && y ? y[1] : "";
          byId[p.id] = p;
        });
        var isAuthor = function (p, author) {
          var w = author.trim().split(/\s+/);
          return plain(w[w.length - 1]) === plain(p.last) && plain(w[0])[0] === plain(p.first)[0];
        };
        X.pubs.forEach(function (pub) {
          pub.lab = [];
          pub.authors.forEach(function (a) {
            people.forEach(function (p) {
              if (isAuthor(p, a) && pub.lab.indexOf(p) < 0) {
                pub.lab.push(p);
                p.papers.push(pub);
                p.counts[pub.theme] = (p.counts[pub.theme] || 0) + 1;
              }
            });
          });
          if (themeById[pub.theme]) themeById[pub.theme].papers.push(pub);
        });
        X.themes.forEach(function (t) {
          t.people = people
            .filter(function (p) {
              return p.counts[t.id];
            })
            .sort(function (a, b) {
              return b.counts[t.id] - a.counts[t.id];
            });
        });
        var group = function (g) {
          return people.filter(function (p) {
            return p.group === g;
          });
        };

        /* ---------- Small pieces ---------- */
        function face(p) {
          return (
            '<span class="face" title="' + esc(p.name) + '"><span aria-hidden="true">' + esc(p.initials) + "</span>" +
            '<img src="' + esc(p.photo) + '" alt="' + esc(p.name) + '" loading="lazy" onerror="this.remove()"></span>'
          );
        }
        function hash(s) {
          var h = 7;
          for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
          return h;
        }
        // A small drawing for each paper, in the colour of its theme and varied by the paper itself.
        function thumb(pub) {
          var h = hash(pub.key || pub.title);
          var r = function (n, from, to) {
            return from + (((h >> (n * 3)) & 15) / 15) * (to - from);
          };
          var body = "";
          if (pub.theme === "process") {
            var ys = [r(0, 22, 40), r(1, 40, 60), r(2, 56, 78)];
            body =
              '<path d="M20 ' + ys[0] + " H46 V" + ys[1] + " H72 V" + ys[2] + ' H84" fill="none" stroke="currentColor" stroke-width="3"/>' +
              '<rect x="10" y="' + (ys[0] - 9) + '" width="20" height="18" rx="5" fill="currentColor"/>' +
              '<rect x="38" y="' + (ys[1] - 9) + '" width="20" height="18" rx="5" fill="currentColor" opacity=".55"/>' +
              '<rect x="68" y="' + (ys[2] - 9) + '" width="20" height="18" rx="5" fill="currentColor"/>';
          } else if (pub.theme === "causal") {
            var a = r(0, 20, 38),
              b = r(1, 60, 80);
            body =
              '<path d="M18 50 H44 L76 ' + a + " M44 50 L76 " + b + '" fill="none" stroke="currentColor" stroke-width="3"/>' +
              '<circle cx="18" cy="50" r="8" fill="currentColor"/><circle cx="78" cy="' + a + '" r="9" fill="currentColor"/>' +
              '<circle cx="78" cy="' + b + '" r="9" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="4 4"/>';
          } else if (pub.theme === "persuasive") {
            body = [0, 1, 2, 3]
              .map(function (i) {
                return '<rect x="18" y="' + (22 + i * 15) + '" width="' + r(i, 26, 64) + '" height="8" rx="4" fill="currentColor" opacity="' + (i % 2 ? 0.5 : 1) + '"/>';
              })
              .join("");
          } else {
            var cx = r(0, 38, 62),
              cy = r(1, 38, 62);
            body =
              '<rect x="16" y="16" width="68" height="68" rx="14" fill="none" stroke="currentColor" stroke-width="3" opacity=".45"/>' +
              '<circle cx="' + cx + '" cy="' + cy + '" r="' + r(2, 12, 20) + '" fill="none" stroke="currentColor" stroke-width="3"/>' +
              '<circle cx="' + cx + '" cy="' + cy + '" r="5" fill="currentColor"/>';
          }
          return '<span class="thumb" data-th="' + esc(pub.theme) + '" aria-hidden="true"><svg viewBox="0 0 100 100">' + body + "</svg></span>";
        }
        var ART = {
          process:
            '<svg viewBox="0 0 112 84" aria-hidden="true"><path d="M14 22 H58 V62 H98"/><rect class="paper" x="2" y="10" width="26" height="24" rx="7"/><rect class="paper" x="45" y="30" width="26" height="24" rx="7"/><rect class="paper" x="84" y="50" width="26" height="24" rx="7"/><circle class="fill a-dot" r="6"/></svg>',
          causal:
            '<svg viewBox="0 0 112 84" aria-hidden="true"><path d="M14 42 H48"/><path class="a-yes" d="M48 42 L92 16"/><path class="a-no" d="M48 42 L92 68" stroke-dasharray="5 7"/><circle class="fill" cx="14" cy="42" r="9"/><circle class="paper" cx="48" cy="42" r="8"/><circle class="fill a-yes" cx="96" cy="14" r="10"/><circle class="fill a-no" cx="96" cy="70" r="10"/></svg>',
          persuasive:
            '<svg viewBox="0 0 112 84" aria-hidden="true"><path class="paper" d="M12 6 H100 a8 8 0 0 1 8 8 V56 a8 8 0 0 1 -8 8 H44 L26 80 V64 H12 a8 8 0 0 1 -8 -8 V14 a8 8 0 0 1 8 -8z"/><path class="a-bar" d="M26 22 H86" stroke-width="7"/><path class="a-bar b2" d="M26 36 H72" stroke-width="7" opacity=".6"/><path class="a-bar b3" d="M26 50 H60" stroke-width="7"/></svg>',
          medical:
            '<svg viewBox="0 0 112 84" aria-hidden="true"><rect class="paper" x="6" y="4" width="100" height="76" rx="14"/><path d="M50 18 C30 20 22 44 24 64 C34 68 46 64 50 58z M62 18 C82 20 90 44 88 64 C78 68 66 64 62 58z" opacity=".55"/><circle class="a-ping" cx="74" cy="44" r="14"/><circle cx="74" cy="44" r="12"/><circle class="fill" cx="74" cy="44" r="4"/></svg>',
        };
        function paperCount(n) {
          return n + (n === 1 ? " paper" : " papers");
        }
        function authors(pub, max) {
          var list = pub.authors.slice(0, max).map(function (a) {
            var mine = pub.lab.some(function (p) {
              return isAuthor(p, a);
            });
            return mine ? "<b>" + esc(a) + "</b>" : esc(a);
          });
          var rest = pub.authors.length - max;
          return list.join(", ") + (rest > 0 ? " and " + rest + " more" : "");
        }
        function pubLink(pub) {
          if (pub.doi) return /^https?:/.test(pub.doi) ? pub.doi : "https://doi.org/" + pub.doi;
          return pub.url || "";
        }
        function pubRow(pub, q) {
          var t = themeById[pub.theme];
          var title = esc(pub.title);
          if (q) {
            q.split(/\s+/).filter(Boolean).forEach(function (w) {
              var re = new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")(?![^<]*>)", "ig");
              title = title.replace(re, "<mark>$1</mark>");
            });
          }
          var link = pubLink(pub);
          return (
            '<li class="pub">' + thumb(pub) + "<div><h3>" + title + '</h3><p class="by">' + authors(pub, 8) + "</p>" +
            '<p class="where">' + esc(pub.venue ? pub.venue + ", " + pub.year : pub.year) + '</p><div class="row">' +
            (t ? '<span class="tag th" data-th="' + esc(t.id) + '">' + esc(t.short) + "</span>" : "") +
            (link ? '<a href="' + esc(link) + '" target="_blank" rel="noopener">' + (pub.doi ? "Read the paper" : "Open") + EXT + "</a>" : "") +
            (pub.code ? '<a href="' + esc(pub.code) + '" target="_blank" rel="noopener">Code' + EXT + "</a>" : "") +
            "</div></div></li>"
          );
        }
        function personTile(p, kind) {
          var t = Object.keys(p.counts).sort(function (a, b) {
            return p.counts[b] - p.counts[a];
          });
          var tags = t.slice(0, 2).map(function (id) {
            return '<span class="tag th" data-th="' + esc(id) + '">' + esc(themeById[id].short) + "</span>";
          });
          if (p.year) tags.unshift('<span class="tag">Graduated ' + esc(p.year) + "</span>");
          var role = p.year ? p.role.replace(/,?\s*\d{4}/, "") : p.role;
          var inner = p.url
            ? '<a class="go" href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.name) + "</a>"
            : esc(p.name);
          return (
            '<li class="tile person ' + (kind || "") + (p.url ? "" : " plain") + '"><div class="pic"><span aria-hidden="true">' + esc(p.initials) +
            '</span><img src="' + esc(p.photo) + '" alt="" loading="lazy" onerror="this.remove()"></div><div><h3>' + inner +
            "</h3><p>" + esc(role) + "</p>" + (tags.length ? '<div class="tags">' + tags.join("") + "</div>" : "") + "</div></li>"
          );
        }
        function head(title, text, crumbs) {
          return (
            '<div class="head"><p class="crumbs"><a href="#/">Home</a> / ' + (crumbs || esc(title)) + "</p><h1>" + esc(title) + "</h1>" +
            (text ? "<p>" + esc(text) + "</p>" : "") + "</div>"
          );
        }

        /* ---------- Views ---------- */
        var views = {};

        views.home = function () {
          var latest = X.pubs[0];
          var lt = themeById[latest.theme];
          var news = X.news.slice(0, 5);
          var video = X.videos[0];
          var crew = group("Leader").concat(group("Researchers"), group("ExternalResearchers")).slice(0, 9);
          var themes = X.themes
            .map(function (t, i) {
              return (
                '<article class="tile t-theme t' + (i + 1) + '" data-th="' + esc(t.id) + '"><div class="art">' + ART[t.id] + "</div>" +
                '<h3><a class="go" href="#/research/' + esc(t.id) + '">' + esc(t.title) + "</a></h3><p>" + esc(t.summary) + "</p>" +
                '<span class="count">' + paperCount(t.papers.length) + '</span><span class="corner" aria-hidden="true">' + ARROW + "</span></article>"
              );
            })
            .join("");
          var link = pubLink(latest);
          return (
            '<div class="wrap in"><section class="hello"><div><p class="at"><i></i>A research lab at Queensland University of Technology</p>' +
            "<h1>XAMI Lab<span>Explainable analytics for machine intelligence</span></h1></div>" +
            '<p class="lead">' + esc(X.intro) + "</p></section>" +
            '<section class="grid" aria-label="The lab at a glance">' +
            '<article class="tile t-photo"><img src="assets/brisbane.jpg" alt="Brisbane river and city, seen from the QUT campus side"><span class="place">Brisbane, Australia</span>' +
            '<div class="text"><p class="kicker">Our vision</p><h2><a class="go" href="#/mission">' + esc(X.vision) + '</a></h2></div><span class="corner" aria-hidden="true">' + ARROW + "</span></article>" +
            themes +
            '<article class="tile t-paper" data-th="' + esc(latest.theme) + '"><p class="kicker">Latest paper<span class="tag th" data-th="' + esc(latest.theme) + '">' + esc(lt ? lt.short : "") + "</span></p>" +
            '<div class="body">' + thumb(latest) + '<div><h3><a class="go" href="#/publications">' + esc(latest.title) + '</a></h3><p>' + authors(latest, 4) + "</p><p><i>" + esc(latest.venue) + ", " + esc(latest.year) + "</i></p></div></div>" +
            '<div class="links over">' + (link ? '<a class="btn" href="' + esc(link) + '" target="_blank" rel="noopener">Read the paper' + EXT + "</a>" : "") +
            '<a class="btn ghost" href="#/publications">All ' + X.pubs.length + " publications</a></div></article>" +
            '<article class="tile t-news"><p class="kicker">News<em><a class="go" href="#/news">All news</a></em></p><div class="stage" id="stage">' +
            news
              .map(function (n, i) {
                var who = (n.who || []).map(function (id) { return byId[id]; }).filter(Boolean);
                return (
                  '<div class="item' + (i ? "" : " on") + '"' + (i ? ' aria-hidden="true"' : "") + "><time>" + esc(when(n.date)) + ' <span class="tag">' + esc(n.kind) + "</span></time><h3>" + esc(n.title) +
                  "</h3><p>" + esc(n.text) + '</p><div class="who">' + who.slice(0, 2).map(face).join("") + "<span>" +
                  esc(who.map(function (p) { return p.name; }).join(" and ")) + "</span></div></div>"
                );
              })
              .join("") +
            '</div><div class="dots over" id="dots">' +
            news.map(function (n, i) {
              return '<button type="button" aria-pressed="' + (i ? "false" : "true") + '" aria-label="Show news item ' + (i + 1) + ": " + esc(n.title) + '"></button>';
            }).join("") +
            "</div></article>" +
            '<article class="tile t-crew"><p class="kicker">People</p><div class="stack">' + crew.map(face).join("") +
            '<span class="face more">+' + (people.length - crew.length) + '</span></div><h3><a class="go" href="#/people">' + people.length + " people at " + X.partners.length +
            " universities</a></h3><p>Led by " + esc(group("Leader").map(function (p) { return p.name; }).join(" and ")) + '.</p><span class="corner" aria-hidden="true">' + ARROW + "</span></article>" +
            '<article class="tile t-nums plain" aria-label="The lab in numbers">' +
            [[X.pubs.length, "papers since 2020"], [people.length, "people"], [X.themes.length, "research themes"], [X.videos.length, "recorded talks"]]
              .map(function (n) { return '<div><b data-to="' + n[0] + '">' + n[0] + "</b><span>" + n[1] + "</span></div>"; })
              .join("") +
            "</article>" +
            '<article class="tile t-video"><img src="https://i.ytimg.com/vi/' + esc(video.id) + '/hqdefault.jpg" alt="" loading="lazy">' + PLAY +
            '<div class="text"><p class="kicker">Watch a talk</p><h3><a class="go" href="#/videos">' + esc(video.title) + "</a></h3><p>" + esc(video.venue) + "</p></div></article>" +
            '<article class="tile t-join"><span class="ring" aria-hidden="true"></span><p class="kicker">Join us</p><h3>' + esc(X.join.lead) +
            '</h3><a class="btn go" href="#/join">See how to join</a></article>' +
            '<article class="tile t-proj plain"><p class="kicker">Project sites<em><a href="#/projects" class="over">About these</a></em></p><ul class="over">' +
            X.projects.map(function (p) {
              return '<li><a href="https://' + esc(p.address) + '" data-placeholder rel="external noopener" target="_blank">' + esc(p.name) + "<span>" + esc(p.address) + "</span>" + EXT + "</a></li>";
            }).join("") +
            "</ul></article>" +
            '<article class="tile t-part plain"><p class="kicker">Where our researchers work</p><div class="logos">' +
            X.partners.map(function (p) { return '<img src="' + esc(p.logo) + '" alt="' + esc(p.name) + '">'; }).join("") +
            "</div></article></section></div>"
          );
        };

        views.research = function (id) {
          var t = themeById[id];
          if (id && !t) return views.missing();
          if (t) {
            var others = X.themes.filter(function (o) { return o.id !== t.id; });
            return (
              '<div class="wrap in" data-th="' + esc(t.id) + '">' +
              head(t.title, t.summary, '<a href="#/research">Research</a> / ' + esc(t.short)) +
              '<div class="figure"><img src="' + esc(t.image) + '" alt="Diagram for ' + esc(t.title) + '"></div>' +
              '<div class="split sec"><div class="tile plain"><p class="kicker">What we study</p><ul class="ticks">' +
              t.topics.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" +
              (t.example ? '<p style="margin-top:18px;font-size:17px;color:var(--ink)"><b>A question we want AI to answer:</b> ' + esc(t.example) + "</p>" : "") +
              "</div>" +
              '<div class="tile plain" style="background:var(--t);border-color:transparent"><p class="kicker" style="color:var(--c)">At a glance</p><h3 style="font-size:40px;letter-spacing:-.03em">' +
              paperCount(t.papers.length) + "</h3><p>" + t.people.length + " people in the lab have published in this theme.</p>" +
              (t.domains ? '<p style="margin-top:14px"><b>Applied in:</b> ' + esc(t.domains.join(", ").toLowerCase()) + ".</p>" : "") +
              '<a class="btn" style="margin-top:18px;align-self:flex-start" href="#/publications?theme=' + esc(t.id) + '">Filter publications by this theme</a></div></div>' +
              (t.people.length
                ? '<section class="sec"><h2>People working on this</h2><ul class="cards big one">' +
                  t.people.map(function (p) { return personTile(p, "small"); }).join("") + "</ul></section>"
                : "") +
              '<section class="sec"><h2>Papers in this theme</h2><p class="note">Papers are sorted into themes by title, so a few may belong elsewhere.</p><ul>' +
              t.papers.map(function (p) { return pubRow(p); }).join("") + "</ul></section>" +
              '<section class="sec"><h2>Other themes</h2><div class="cards big">' +
              others.map(function (o) {
                return '<article class="tile t-theme" style="min-height:0" data-th="' + esc(o.id) + '"><div class="art">' + ART[o.id] + '</div><h3><a class="go" href="#/research/' + esc(o.id) + '">' + esc(o.title) +
                  '</a></h3><span class="count">' + paperCount(o.papers.length) + "</span></article>";
              }).join("") +
              "</div></section></div>"
            );
          }
          return (
            '<div class="wrap in">' +
            head("Research", "Four connected themes, one question: how can a person see why a machine made its decision?") +
            X.themes
              .map(function (t) {
                return (
                  '<article class="tile theme-row" data-th="' + esc(t.id) + '"><div class="txt"><div class="art" style="width:90px;height:68px;color:var(--c)">' +
                  ART[t.id].replace("<svg", '<svg style="width:100%;height:100%;overflow:visible;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round"') +
                  '</div><h2><a class="go" href="#/research/' + esc(t.id) + '">' + esc(t.title) + "</a></h2><p>" + esc(t.summary) + "</p><p>We study " +
                  esc(t.topics.slice(0, 3).join(", ").toLowerCase()) + ' and more.</p><div class="meta"><span class="mini">' + t.people.slice(0, 5).map(face).join("") +
                  "</span><span>" + paperCount(t.papers.length) + '</span></div></div><div class="fig"><img src="' + esc(t.image) + '" alt="" loading="lazy"></div></article>'
                );
              })
              .join("") +
            "</div>"
          );
        };

        views.people = function () {
          var out = '<div class="wrap in">' + head("People", people.length + " researchers, students and collaborators across Brisbane, Sydney, Lisbon, Leuven and Bangalore.");
          Object.keys(X.groups).forEach(function (g) {
            var list = group(g);
            if (!list.length) return;
            var kind = g === "Leader" ? "lead" : g === "Collaborators" || g === "Alumni" ? "small" : "";
            var cls = g === "Leader" ? "cards big" : kind === "small" ? "cards big" : "cards";
            out += '<section class="sec"><h2>' + esc(X.groups[g]) + '</h2><ul class="' + cls + '">' +
              list.map(function (p) { return personTile(p, kind); }).join("") + "</ul></section>";
          });
          return out + "</div>";
        };

        var filter = { q: "", year: "", theme: "" };
        function pubList() {
          var words = plain(filter.q).split(/\s+/).filter(Boolean);
          var hits = X.pubs.filter(function (p) {
            if (filter.year && String(p.year) !== filter.year) return false;
            if (filter.theme && p.theme !== filter.theme) return false;
            var text = plain(p.title + " " + p.authors.join(" ") + " " + p.venue + " " + p.year);
            return words.every(function (w) { return text.indexOf(w) >= 0; });
          });
          var html = "";
          var year = null;
          hits.forEach(function (p) {
            if (p.year !== year) {
              if (year !== null) html += "</ul>";
              year = p.year;
              var n = hits.filter(function (h) { return h.year === year; }).length;
              html += '<h2 class="year">' + esc(year) + "<small>" + paperCount(n) + "</small></h2><ul>";
            }
            html += pubRow(p, filter.q);
          });
          if (hits.length) html += "</ul>";
          else html = '<p class="empty">No publications match. Try fewer words, or <a href="#/publications" id="clear">clear the filters</a>.</p>';
          $("publist").innerHTML = html;
          $("pubcount").textContent = "Showing " + hits.length + " of " + X.pubs.length + " publications";
        }
        views.publications = function (rest, query) {
          filter = { q: query.get("q") || "", year: query.get("year") || "", theme: query.get("theme") || "" };
          var years = [];
          X.pubs.forEach(function (p) { if (years.indexOf(p.year) < 0) years.push(p.year); });
          var chip = function (kind, value, label, th) {
            return '<button type="button" class="chip' + (th ? " th" : "") + '"' + (th ? ' data-th="' + esc(value) + '"' : "") + ' data-kind="' + kind + '" data-value="' + esc(value) +
              '" aria-pressed="' + (String(filter[kind]) === String(value)) + '">' + esc(label) + "</button>";
          };
          return (
            '<div class="wrap in">' + head("Publications", "Every paper from the lab since 2020. Search by title, author or venue, or narrow by year and theme.") +
            '<div class="tools"><label class="find"><span class="skip">Search publications</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>' +
            '<input id="q" type="search" placeholder="Search title, author or venue" value="' + esc(filter.q) + '" autocomplete="off"></label>' +
            '<div class="chips"><span>Year</span>' + chip("year", "", "All years") + years.map(function (y) { return chip("year", y, y); }).join("") + "</div>" +
            '<div class="chips"><span>Theme</span>' + chip("theme", "", "All themes") + X.themes.map(function (t) { return chip("theme", t.id, t.short, true); }).join("") +
            '</div><p class="count" id="pubcount" aria-live="polite"></p></div><div id="publist"></div></div>'
          );
        };

        views.news = function () {
          return (
            '<div class="wrap in">' + head("News", "New people, graduations and papers from the lab.") + '<ul class="list">' +
            X.news.map(function (n) {
              var who = (n.who || []).map(function (id) { return byId[id]; }).filter(Boolean);
              return '<li class="tile newsitem plain"><div class="when">' + esc(when(n.date)) + '<br><span class="tag">' + esc(n.kind) + "</span></div><div><h3>" + esc(n.title) +
                "</h3><p>" + esc(n.text) + '</p></div><span class="mini">' + who.map(face).join("") + "</span></li>";
            }).join("") +
            "</ul></div>"
          );
        };

        views.videos = function () {
          return (
            '<div class="wrap in">' + head("Videos", "Talks and seminars by lab members. Each one opens on YouTube.") + '<ul class="cards big">' +
            X.videos.map(function (v) {
              return '<li class="tile vid"><div class="shot"><img src="https://i.ytimg.com/vi/' + esc(v.id) + '/hqdefault.jpg" alt="" loading="lazy">' + PLAY +
                '</div><div class="txt"><span class="tag">' + esc(v.venue) + '</span><h3><a class="go" href="https://www.youtube.com/watch?v=' + esc(v.id) +
                '" target="_blank" rel="noopener">' + esc(v.title) + "</a></h3></div></li>";
            }).join("") +
            "</ul></div>"
          );
        };

        views.join = function () {
          var chun = byId.chunouyang;
          return (
            '<div class="wrap in">' + head("Join us", X.join.lead) + '<ul class="cards big">' +
            X.join.options.map(function (o, i) {
              var th = ["process", "causal", "medical"][i % 3];
              return '<li class="tile plain" data-th="' + th + '" style="background:var(--t);border-color:transparent;min-height:200px"><h3 style="font-size:24px">' + esc(o.title) +
                '</h3><p style="margin-top:8px;color:var(--ink)">' + esc(o.text) + "</p></li>";
            }).join("") +
            '</ul><section class="sec"><div class="tile t-join" style="min-height:230px"><span class="ring" aria-hidden="true"></span><p class="kicker">Get in touch</p>' +
            '<h3 style="max-width:26ch">Tell us what you would like to work on, and which theme it fits.</h3>' +
            '<a class="btn go" href="' + esc((chun && chun.url) || "#/people") + '"' + (chun && chun.url ? ' target="_blank" rel="noopener"' : "") + ">" + esc(X.join.contact) + "</a></div></section>" +
            '<section class="sec"><h2>Pick a theme first</h2><div class="cards big">' +
            X.themes.map(function (o) {
              return '<article class="tile t-theme" style="min-height:0" data-th="' + esc(o.id) + '"><h3 style="margin-top:0"><a class="go" href="#/research/' + esc(o.id) + '">' + esc(o.title) +
                "</a></h3><p>" + esc(o.summary) + "</p></article>";
            }).join("") +
            "</div></section></div>"
          );
        };

        views.mission = function () {
          var mission = [
            ["Create breakthroughs in building explainable analytics for machine intelligence", [
              "Devise new methods and techniques to build robust and interpretable models",
              "Design new theories and algorithms to detect biases and provide ethical and fair analyses of machine learned predictions",
              "Develop new frameworks and tools for user-centric intelligent predictive systems that keep humans in the loop",
            ]],
            ["Apply explainable machine intelligence to a wide range of application domains and industry sectors", []],
            ["Build collaborative networks and foster partnerships in explainable machine intelligence", []],
            ["Cultivate young research students to become a new generation of achievers in data science", []],
          ];
          return (
            '<div class="wrap in">' + head("Our mission", X.tagline + ".") +
            '<div class="tile t-photo plain" style="min-height:340px"><img src="assets/brisbane.jpg" alt=""><div class="text"><p class="kicker">Our vision</p><h2 style="max-width:34ch">' + esc(X.vision) + "</h2></div></div>" +
            '<div class="split sec"><div class="tile plain"><p class="kicker">What we set out to do</p><ul class="ticks">' +
            mission.map(function (m) {
              return "<li>" + esc(m[0]) + (m[1].length ? "<ul>" + m[1].map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ul>" : "") + "</li>";
            }).join("") +
            '</ul></div><div class="tile plain" data-th="medical" style="background:var(--t);border-color:transparent"><p class="kicker" style="color:var(--c)">What we value</p><ul class="ticks">' +
            X.values.map(function (v) { return '<li style="font-weight:700;font-size:18px">' + esc(v) + "</li>"; }).join("") + "</ul></div></div>" +
            '<section class="sec"><h2>Research themes</h2><div class="cards big">' +
            X.themes.map(function (o) {
              return '<article class="tile t-theme" style="min-height:0" data-th="' + esc(o.id) + '"><div class="art">' + ART[o.id] + '</div><h3><a class="go" href="#/research/' + esc(o.id) + '">' + esc(o.title) + "</a></h3></article>";
            }).join("") +
            "</div></section></div>"
          );
        };

        views.projects = function () {
          return (
            '<div class="wrap in">' + head("Project sites", "Some projects have a website of their own, with their own look. These links leave the lab site and open in a new tab.") +
            '<ul class="cards big">' +
            X.projects.map(function (p) {
              return '<li class="tile" style="border-style:dashed;min-height:210px"><p class="kicker">Separate website' + EXT + '</p><h3 style="font-size:24px"><a class="go" data-placeholder href="https://' + esc(p.address) +
                '" target="_blank" rel="external noopener">' + esc(p.name) + '</a></h3><p style="margin-top:6px">' + esc(p.text) + '</p><p style="margin-top:auto;font-weight:700;color:var(--link)">' + esc(p.address) + "</p></li>";
            }).join("") +
            "</ul></div>"
          );
        };

        views.missing = function () {
          return '<div class="wrap in">' + head("Page not found", "This page does not exist.") + '<a class="btn" href="#/">Back to the home page</a></div>';
        };

        /* ---------- Menu and footer ---------- */
        var routes = { Mission: "mission", People: "people", Research: "research", Publications: "publications", News: "news", Videos: "videos", "Join us": "join" };
        var items = X.nav
          .filter(function (n) { return n.label !== "Join us"; })
          .map(function (n) { return { label: n.label, to: routes[n.label] || "" }; });
        items.push({ label: "Projects", to: "projects" }, { label: "Join us", to: "join", join: true });
        $("menu").innerHTML = items
          .map(function (n) { return '<a href="#/' + n.to + '" data-to="' + n.to + '"' + (n.join ? ' class="join"' : "") + ">" + esc(n.label) + "</a>"; })
          .join("");
        $("foot-nav").innerHTML = items.map(function (n) { return '<li><a href="#/' + n.to + '">' + esc(n.label) + "</a></li>"; }).join("");
        $("foot-logos").innerHTML = X.partners.map(function (p) { return '<img src="' + esc(p.logo) + '" alt="' + esc(p.name) + '">'; }).join("");
        $("foot-line").textContent = X.tagline + ".";

        /* ---------- Behaviour ---------- */
        var timer = null;
        function startNews() {
          clearInterval(timer);
          var stage = $("stage");
          if (!stage) return;
          var slides = stage.querySelectorAll(".item");
          var dots = $("dots").querySelectorAll("button");
          var at = 0;
          var paused = false;
          function show(i) {
            at = (i + slides.length) % slides.length;
            slides.forEach(function (s, n) {
              s.classList.toggle("on", n === at);
              if (n === at) s.removeAttribute("aria-hidden");
              else s.setAttribute("aria-hidden", "true");
            });
            dots.forEach(function (d, n) { d.setAttribute("aria-pressed", n === at); });
          }
          dots.forEach(function (d, n) {
            d.addEventListener("click", function () { show(n); paused = true; });
          });
          var tile = stage.closest(".tile");
          tile.addEventListener("pointerenter", function () { paused = true; });
          tile.addEventListener("pointerleave", function () { paused = false; });
          tile.addEventListener("focusin", function () { paused = true; });
          if (!still) timer = setInterval(function () { if (!paused && document.body.contains(stage)) show(at + 1); }, 4800);
        }
        function countUp() {
          if (still) return;
          document.querySelectorAll("[data-to]").forEach(function (el) {
            if (el.tagName !== "B") return;
            var to = +el.getAttribute("data-to");
            var start = null;
            el.textContent = "0";
            function step(now) {
              if (start === null) start = now;
              var k = Math.min(1, (now - start) / 1100);
              el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3)));
              if (k < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
            setTimeout(function () { el.textContent = to; }, 1500);
          });
        }
        function tilt() {
          if (still || !matchMedia("(hover: hover) and (pointer: fine)").matches) return;
          document.querySelectorAll(".tile:not(.plain)").forEach(function (t) {
            t.addEventListener("pointermove", function (e) {
              var r = t.getBoundingClientRect();
              var x = (e.clientX - r.left) / r.width - 0.5;
              var y = (e.clientY - r.top) / r.height - 0.5;
              var strength = Math.min(5, 1400 / r.width);
              t.classList.add("live");
              t.style.setProperty("--ry", (x * strength).toFixed(2) + "deg");
              t.style.setProperty("--rx", (-y * strength).toFixed(2) + "deg");
            });
            t.addEventListener("pointerleave", function () {
              t.classList.remove("live");
              t.style.setProperty("--ry", "0deg");
              t.style.setProperty("--rx", "0deg");
            });
          });
        }
        function wirePublications() {
          var q = $("q");
          if (!q) return;
          pubList();
          q.addEventListener("input", function () { filter.q = q.value; pubList(); });
          document.querySelectorAll(".chip").forEach(function (c) {
            c.addEventListener("click", function () {
              var kind = c.getAttribute("data-kind");
              filter[kind] = c.getAttribute("data-value");
              document.querySelectorAll('.chip[data-kind="' + kind + '"]').forEach(function (o) { o.setAttribute("aria-pressed", o === c); });
              pubList();
            });
          });
          $("publist").addEventListener("click", function (e) {
            if (e.target.id !== "clear") return;
            e.preventDefault();
            filter = { q: "", year: "", theme: "" };
            q.value = "";
            document.querySelectorAll(".chip").forEach(function (o) { o.setAttribute("aria-pressed", o.getAttribute("data-value") === ""); });
            pubList();
          });
        }

        var first = true;
        function render() {
          var raw = location.hash.replace(/^#\/?/, "");
          var parts = raw.split("?");
          var path = parts[0].split("/").filter(Boolean);
          var query = new URLSearchParams(parts[1] || "");
          var name = path[0] || "home";
          var view = views[name] || views.missing;
          $("view").innerHTML = view(path[1], query);
          document.querySelectorAll("#menu a").forEach(function (a) {
            if (a.getAttribute("data-to") === (name === "home" ? "-" : name)) a.setAttribute("aria-current", "page");
            else a.removeAttribute("aria-current");
          });
          $("menu").classList.remove("open");
          $("menubtn").setAttribute("aria-expanded", "false");
          var h = $("view").querySelector("h1");
          document.title = (name === "home" ? "" : h.textContent + ", ") + "XAMI Lab";
          if (!first) {
            window.scrollTo(0, 0);
            $("view").focus({ preventScroll: true });
          }
          first = false;
          if (name === "home") {
            startNews();
            countUp();
          }
          if (name === "publications") wirePublications();
          tilt();
        }
        window.addEventListener("hashchange", render);
        render();

        $("menubtn").addEventListener("click", function () {
          var open = $("menu").classList.toggle("open");
          this.setAttribute("aria-expanded", open);
        });
        $("look").addEventListener("click", function () {
          var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", next);
          try {
            localStorage.setItem("xami-appearance", next);
          } catch (e) {}
        });
        window.addEventListener("scroll", function () { $("top").classList.toggle("scrolled", window.scrollY > 8); }, { passive: true });

        // Project sites are placeholders for now, so say so instead of opening an address that does not exist yet.
        var toastTimer;
        document.addEventListener("click", function (e) {
          var a = e.target.closest && e.target.closest("a[data-placeholder]");
          if (!a) return;
          e.preventDefault();
          var t = $("toast");
          t.textContent = "This project site is a placeholder. The real one will open in a new tab.";
          t.classList.add("on");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(function () { t.classList.remove("on"); }, 3200);
        });
      })();
    </script>
  </body>
</html>
